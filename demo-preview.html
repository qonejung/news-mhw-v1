.progress-band{background:#fff;position:sticky;top:67px;z-index:20;border-bottom:1px solid #e9ecf0;padding:13px 22px 10px}.progress-band__row{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.15px;color:#66758d;text-transform:uppercase}.article-counter{font-size:12px;font-weight:750;color:#414d5f}.progress-title{font-size:12px;color:#6b7787;margin-top:5px}.progress-track{height:4px;border-radius:10px;background:#e9edf2;margin-top:10px;overflow:hidden}.progress-fill{height:100%;background:#7b858f;border-radius:10px;transition:width .25s}
.page{padding:20px 22px 42px;min-height:calc(100vh - 125px)}.news-masthead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 15px;border-bottom:1px solid #e1e4e8}.news-wordmark{font-size:24px;font-weight:900;letter-spacing:-1.3px;color:#3b4655}.news-wordmark__light{color:#88919d}.news-section{font-size:10px;font-weight:800;color:#5d6b80;letter-spacing:1.15px}.news-kicker{font-size:10px;font-weight:900;letter-spacing:1.08px;color:#4e6179;text-transform:uppercase;margin-top:32px}.news-title{font-family:Georgia,'Times New Roman',serif;font-weight:bold;font-size:clamp(28px,7.3vw,37px);letter-spacing:-.8px;line-height:1.07;margin:16px 0 22px;color:#142038}.byline{font-size:11px;color:#7b8595;margin-bottom:21px}.rule{height:1px;background:var(--line);margin:18px 0 22px}.img-placeholder{height:205px;border-radius:4px;background:#d7d9dd;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#929ba7;gap:9px}.img-placeholder svg{width:25px;height:25px}.img-placeholder span{font-size:11px}.img-placeholder img{width:100%;height:100%;object-fit:cover}.img-note{font-size:10px;color:#8793a3;margin-top:9px}.reading-tip{background:#fcfbf6;border:1px solid #e9debe;border-radius:11px;padding:16px;margin:25px 0 20px}.reading-tip strong{font-size:12px}.reading-tip p{font-size:12px;line-height:1.65;margin:8px 0}.tip-count{font-size:11px;font-weight:750;color:#84672b}.reading-tip__heading{display:flex;align-items:center;gap:7px;color:#303943}.reading-tip__heading svg{width:18px;height:18px}.article-body{font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.84;color:#1e2530}.article-body p{margin:0 0 24px}.sentence{cursor:pointer;border-radius:3px;-webkit-tap-highlight-color:transparent;transition:background .15s}.sentence:hover{background:#f5f5f2}.sentence:focus-visible{outline:2px solid #7c91a5}.sentence--selected{background:#ffeba0;box-shadow:0 0 0 3px #ffeba0}.sentence--selected:hover{background:#ffe28d}.notice{font-size:12px;color:#926326;margin:8px 0 15px}.quiz{padding:18px;border:1px solid #e4e7eb;background:#f9fafb;border-radius:12px;margin-top:31px}.quiz h3{margin:0 0 12px;font-size:15px}.quiz p{font-size:13px;line-height:1.6;margin:0 0 13px}.quiz-option{display:flex;align-items:center;gap:10px;background:white;border:1px solid #e0e4e9;border-radius:8px;padding:12px;margin:8px 0;font-size:13px}.quiz-option input{accent-color:#505d6b}.quiz-status{font-size:12px;color:#506555;margin:12px 0 0}.quiz-status svg{vertical-align:middle}.secondary-btn{border:1px solid #d3d7df;background:#fff;border-radius:8px;color:#303a49;padding:10px 13px;font-weight:700;font-size:12px;margin-top:10px}.secondary-btn:hover{background:#f2f3f5}.requirement-box{border:1px solid #e7eaf0;background:#f9fafb;border-radius:11px;margin-top:22px;padding:16px}.requirement-heading{font-size:13px;font-weight:800;margin-bottom:12px}.requirement-line{display:flex;align-items:center;gap:9px;font-size:12px;color:#657080;margin:9px 0}.requirement-line--done{color:#337356}.requirement-bullet{font-weight:bold;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#e4e8ed;color:#727d8a;font-size:11px}.requirement-line--done .requirement-bullet{background:#e2f1e6;color:#28704c}.primary-btn{background:#303a48;color:white;border:0;border-radius:10px;padding:15px 17px;font-size:14px;font-weight:750;width:100%;margin-top:17px;min-height:49px}.primary-btn:not(:disabled):hover{background:#1a2533}.helper{font-size:11px;line-height:1.55;color:#788393;margin-top:8px}.phase-intro{padding:10px 0 22px}.phase-intro h1{font-family:Georgia,'Times New Roman',serif;font-size:29px;line-height:1.12;margin:8px 0 12px}.phase-intro p{font-size:13px;line-height:1.65;color:#687588;margin:0}.assessment{margin:0;padding:0;border:0}.question{padding:20px 0 19px;border-top:1px solid #e7eaee}.question__top{display:flex;justify-content:space-between;gap:9px;align-items:start}.question__index{color:#748092;font-weight:800;font-size:10px;letter-spacing:.7px;white-space:nowrap;margin-top:3px}.question h2{font-size:14px;line-height:1.55;margin:0 0 13px;font-weight:750;flex:1}.options{display:grid;gap:8px}.option{position:relative;display:flex;gap:11px;align-items:flex-start;border:1px solid #dce1e7;border-radius:9px;padding:12px 13px;line-height:1.4;font-size:12px;color:#354254;cursor:pointer;min-height:44px;background:#fff}.option:has(input:checked){border-color:#526272;background:#f2f5f7;box-shadow:inset 0 0 0 1px #526272}.option input{margin:1px 0 0;accent-color:#384958;flex-shrink:0}.option span{flex:1}.text-field{margin:11px 0 0 26px;width:calc(100% - 26px);border-radius:8px;border:1px solid #cbd2da;padding:11px;font-size:13px}.form-hint{color:#667085;font-size:12px;margin:12px 0 0}.complete-card{padding:25px 0 30px;text-align:center}.complete-mark{background:#e9f0ed;color:#347450;border-radius:50%;width:60px;height:60px;margin:12px auto 16px;display:grid;place-items:center;font-size:29px}.complete-card h1{font-family:Georgia,serif;font-size:30px;margin:8px 0}.complete-card p{font-size:13px;color:#697587;line-height:1.65}.completion-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}.completion-stat{background:#f5f7fa;border-radius:10px;padding:13px 6px}.completion-stat strong{font-size:21px;display:block}.completion-stat small{color:#798596;font-size:11px}
.overlay{position:fixed;inset:0;background:#12202d77;z-index:50;display:flex;justify-content:center;align-items:flex-end}.settings-panel{width:min(100%,520px);max-height:min(90vh,720px);background:#fff;border-radius:18px 18px 0 0;overflow-y:auto;box-shadow:0 -10px 30px #1117}.settings-header{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #e5e8ec;padding:17px 20px;display:flex;align-items:center;justify-content:space-between}.settings-header h2{font-size:16px;margin:0}.settings-content{padding:20px}.settings-desc{font-size:12px;color:#687588;line-height:1.6;margin-top:0;margin-bottom:15px}.settings-row{padding:15px 0;border-top:1px solid #e9eaec;display:flex;align-items:center;justify-content:space-between;gap:15px}.settings-row strong{font-size:13px;display:block}.settings-row small{font-size:11px;color:#7a8698;display:block;margin-top:5px;line-height:1.4}.settings-row input[type=checkbox]{height:20px;width:20px;accent-color:#4b596b;flex-shrink:0}.number-input{width:80px;border:1px solid #bdc6ce;border-radius:8px;padding:9px;font-size:14px}.settings-actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.settings-actions button{flex:1;white-space:nowrap}.warning{padding:12px;background:#fff8e8;color:#785e26;border:1px solid #eee0b5;font-size:11px;line-height:1.5;border-radius:8px}.footer-note{padding:16px 20px 28px;background:#f8f9fb;color:#8994a3;font-size:10px;line-height:1.5;text-align:center;border-top:1px solid #e7e9ed}.error{padding:25px;color:#8c3535;line-height:1.65}body.modal-open{overflow:hidden}

/* Article/reference tabs */
.view-tabs{position:sticky;top:var(--progress-bottom,145px);z-index:19;display:flex;gap:0;background:#fff;border-bottom:1px solid #dce2e9;padding:0 18px;box-shadow:0 3px 6px #24364c08}
.view-tab{flex:1;min-height:48px;border:0;border-bottom:3px solid transparent;background:#fff;color:#647082;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.view-tab--active{border-bottom-color:#343f4e;color:#223248}
.view-tab:not(.view-tab--active):hover{background:#f5f6f8}
.tab-count{font-size:10px;background:#edf0f3;border-radius:10px;padding:3px 6px;color:#5b6778}
.review-notice{background:#f1f4f7;border:1px solid #dfe4e9;border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:1.5;margin-bottom:20px;color:#48566a}
.review-notice strong{color:#27394a}
.article-reference-link{display:inline-flex;align-items:center;gap:7px;margin:0 0 20px;padding:10px 13px;border:1px solid #d7dce2;border-radius:8px;background:#f8fafb;color:#334357;font-size:12px;font-weight:700}
.review-bottom{padding-top:16px;border-top:1px solid #e7eaf0;margin-top:20px}
.sentence-readonly{border-radius:2px}
@media(max-width:370px){.view-tabs{padding:0 10px}.view-tab{font-size:12px;gap:5px}}

/* CSS Media article survey: question numbering, article/evaluation tabs. */
.question__top{justify-content:flex-start;align-items:flex-start;gap:10px}
.question__index{order:0;display:inline-block;flex:none;width:22px;min-width:22px;font-size:13px;line-height:1.55;margin-top:0;letter-spacing:0;color:#465365;text-align:left}
.question h2{order:1;min-width:0;margin:0 0 13px}
.phase-intro{padding-top:11px}
.phase-intro h1{margin-top:0}

/* Survey introduction and news-set selector */
.intro-page{padding-top:31px}.intro-overline{color:#6c7889;font-size:11px;letter-spacing:1.15px;font-weight:800;margin-bottom:10px}
.intro-page h1{font-family:Georgia,'Times New Roman',serif;font-size:34px;line-height:1.15;margin:0 0 18px;color:#142038}
.intro-page>p{font-size:14px;line-height:1.7;color:#47566a;margin-bottom:20px}
.intro-steps{border:1px solid #e3e8ed;border-radius:13px;padding:8px 16px;background:#fafbfd;margin:23px 0}
.intro-step{display:flex;align-items:flex-start;gap:12px;padding:13px 0}.intro-step+.intro-step{border-top:1px solid #e9ecf0}
.intro-step>span{flex:none;border:1px solid #d5dce5;background:white;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-weight:bold;color:#4e5968;font-size:12px}
.intro-step p{margin:0;color:#5d6a79;font-size:12.5px;line-height:1.6}.intro-step strong{display:block;color:#253346;font-size:13px;margin-bottom:1px}
.intro-footnote{padding:10px 0 4px;color:#758292!important;font-size:12px!important}
.news-set-control{padding:14px;border:1px solid #dbe2ea;background:#f7f9fb;border-radius:11px;margin:8px 0 17px}
.news-set-control strong{display:block;font-size:13px}.news-set-control small{display:block;color:#7a8698;font-size:11px;line-height:1.4;margin:6px 0 12px}
.news-set-control__entry{display:flex;align-items:center;gap:10px}.news-set-control__entry .number-input{flex:none;width:82px;background:#fff}.news-set-control__entry .secondary-btn{margin-top:0;flex:1;min-height:42px}
.news-set-current{display:block;font-size:11px;color:#64758a;margin-top:10px}

<script>window.__CSS_ARTICLE_SURVEY_PREVIEW_DATA__={"config":{"studyTitle":"CSS Media article survey","newsSetId":1,"maxArticles":10,"shuffleArticles":false,"readingRequirements":{"highlightEnabled":false,"quizEnabled":false,"minimumTimeEnabled":false,"minimumSeconds":10},"surveySettings":{"allowIncompleteResponses":true}},"articles":[{"id":"imm_01_neutral","coreId":"IMM_01","topic":"immigration","condition":"neutral","title":"Federal Departure Offer Includes Payment, Travel Help and Return Questions","body":["The U.S. Department of Homeland Security announced on May 5, 2025, that migrants who voluntarily leave the United States may receive a $1,000 payment and travel assistance. The offer concerns people without legal status. It combines financial support for departure with a government statement about the possibility of returning legally in the future.","Payment would follow confirmation that the person had returned to their home country. DHS said the stipend and possible airfare coverage would cost less than conventional deportation. It estimated the average cost of arresting, detaining and deporting someone without legal status at approximately $17,000. The government previously launched CBP Home to facilitate voluntary departure. That application earlier operated as CBP One for a different immigration-related function.","Homeland Security Secretary Kristi Noem described voluntary departure as safer and less costly than arrest and formal deportation. Make the Road New York, an immigrant advocacy organization, criticized the program and advised migrants considering the offer to consult an attorney. A representative argued that those who leave may encounter significant barriers to returning legally. These statements present different assessments of the departure offer.","DHS said leaving voluntarily may help preserve a person's ability to return legally to the United States. However, the department did not identify a specific legal pathway or program for that return. The financial payment has a stated condition, confirmation of arrival home, while the government's account of possible future legal return leaves the route unspecified."],"attentionCheck":{"statement":"The departure offer includes travel assistance for migrants who voluntarily leave the United States.","correctAnswer":true},"sourceFile":"IMM_01_NEUTRAL_00.txt"},{"id":"imm_01_negative","coreId":"IMM_01","topic":"immigration","condition":"negative","title":"Defending Departure Payments While Return Remains Unspecified Is Irresponsible","body":["A payment for leaving does not deserve approval when the accompanying account of future legal return names no route. On May 5, 2025, the U.S. Department of Homeland Security announced that migrants voluntarily leaving the United States may receive $1,000 and travel assistance. Endorsing this incentive on financial terms alone gives an irresponsible reading of the offer more legitimacy than it deserves.","The stipend would be paid after confirmed return to the person's home country. DHS said payment and potential airfare support would cost less than conventional deportation. It estimated an average of approximately $17,000 for arresting, detaining and deporting someone without legal status. The previously launched CBP Home application facilitates voluntary departure and formerly operated as CBP One for a different immigration-related function. Administrative detail cannot substitute for clarity about return.","Homeland Security Secretary Kristi Noem described voluntary departure as safer and less costly than arrest and formal deportation. Make the Road New York criticized the program and advised consulting an attorney. Its representative argued that those leaving may face significant barriers to returning legally. Against that warning, treating the cost claim as the controlling argument is dismissive of the central uncertainty. Such an interpretation warrants rejection rather than polite accommodation.","DHS stated that voluntary departure may preserve future legal return but identified no specific pathway or program. The choice is whether to insist that this omission matters or allow departure incentives to overshadow it. Splitting the difference lends undeserved authority to an inadequate defense. The payment cannot justify support for this restrictive offer."],"attentionCheck":{"statement":"The departure offer includes travel assistance for migrants who voluntarily leave the United States.","correctAnswer":true},"sourceFile":"IMM_01_POLAR_NEG_04.txt"},{"id":"imm_01_negative_plus","coreId":"IMM_01","topic":"immigration","condition":"negative_plus","title":"An Unspecified Return Route Makes Departure Incentive Defenses Indefensible","body":["Defending a departure payment while its account of future legal return supplies no pathway is an indefensible priority. The U.S. Department of Homeland Security announced on May 5, 2025, that migrants voluntarily leaving the United States may receive $1,000 and travel assistance. This restrictive incentive deserves opposition. Its financial terms should not confer respectability on an argument that leaves future access unresolved.","Payment comes after confirmation of return to the person's home country. DHS said the stipend and potential airfare coverage would cost less than conventional deportation, estimating approximately $17,000 for arresting, detaining and deporting a person without legal status. CBP Home was previously launched to facilitate voluntary departure. It earlier operated as CBP One for a different immigration-related function. Making these details decisive mistakes administrative specificity for justification.","Homeland Security Secretary Kristi Noem called voluntary departure safer and less costly than arrest and formal deportation. Make the Road New York criticized the program, recommended consulting an attorney and provided a representative's warning about possible significant barriers to legal return. The warning is not a settled legal outcome. But subordinating it to the cost argument is a contemptible ordering of concerns, one that merits no accommodation merely because it comes wrapped in financial precision.","DHS said leaving voluntarily may preserve future legal return; it identified no specific pathway or program. Either this omission defeats the defense, or departure payments are permitted to crowd out the unresolved question. There is no responsible middle ground in that reading. An unspecified route cannot earn this departure offer the legitimacy its financial framing demands."],"attentionCheck":{"statement":"The departure offer includes travel assistance for migrants who voluntarily leave the United States.","correctAnswer":true},"sourceFile":"IMM_01_POLAR_NEG_05.txt"},{"id":"imm_01_positive","coreId":"IMM_01","topic":"immigration","condition":"positive","title":"Opposition to Departure Assistance Gives Uncertainty Too Much Authority","body":["Rejecting assisted voluntary departure over an unspecified future return route is an irresponsible way to judge this offer. The U.S. Department of Homeland Security announced on May 5, 2025, that migrants who voluntarily leave the United States may receive $1,000 and travel assistance. The choice deserves a clear assessment: support a departure incentive or let objections eclipse its stated purpose.","The stipend is payable after confirmation of return to the person's home country. DHS said payment and potential airfare coverage would cost less than conventional deportation, estimating the average cost of arresting, detaining and deporting someone without legal status at approximately $17,000. The government previously launched CBP Home for voluntary departure. It formerly operated as CBP One for a different immigration-related function. Those details deserve priority over abstract dismissal.","Homeland Security Secretary Kristi Noem described voluntary departure as safer and less costly than arrest and formal deportation. Make the Road New York criticized the program and advised migrants to consult an attorney. Its representative warned that departure may bring significant barriers to legal return. But the warning should not acquire veto power over the offer. Treating that objection as decisive turns caution into an unjustified judgment against assistance for leaving.","DHS said leaving voluntarily may preserve future legal return, while providing no specific pathway or program. That limitation remains real. Yet accommodating a rejection built around it gives the opposing reading more legitimacy than it deserves. The missing route warrants acknowledgment, not surrender of the case for assisted departure to speculative objections."],"attentionCheck":{"statement":"The departure offer includes travel assistance for migrants who voluntarily leave the United States.","correctAnswer":true},"sourceFile":"IMM_01_POLAR_POS_04.txt"},{"id":"imm_01_positive_plus","coreId":"IMM_01","topic":"immigration","condition":"positive_plus","title":"Departure Assistance Should Not Yield to the Politics of Objection","body":["The case for assisted voluntary departure should not be surrendered to objections that make uncertainty the enemy of action. On May 5, 2025, the U.S. Department of Homeland Security announced a possible $1,000 payment and travel assistance for migrants voluntarily leaving the United States. Opposing this specific departure incentive elevates an unresolved return question into a reason to reject the offer itself, an indefensible priority.","Payment depends on confirmed return to the person's home country. DHS said the stipend and possible airfare coverage would be cheaper than conventional deportation, estimating approximately $17,000 for arresting, detaining and deporting a person without legal status. CBP Home had already been launched to facilitate voluntary departure; it previously operated as CBP One for a different immigration-related function. Dismissing departure support despite these terms is no mark of responsible judgment.","Homeland Security Secretary Kristi Noem described voluntary departure as safer and less costly than arrest and formal deportation. Make the Road New York criticized the program, advised consulting an attorney and issued a representative's warning about possible significant barriers to legal return. That warning remains a claim. Giving it supremacy over the departure offer rewards an objection with authority it has not earned. Such reasoning deserves rejection, not accommodation.","DHS said voluntary departure may preserve future legal return but specified no pathway or program. This uncertainty must remain explicit. It cannot justify capitulation to the opposing interpretation. The dividing line is plain: recognize the value of assistance for leaving, or dignify a dismissive position that lets a missing return route invalidate the entire incentive."],"attentionCheck":{"statement":"The departure offer includes travel assistance for migrants who voluntarily leave the United States.","correctAnswer":true},"sourceFile":"IMM_01_POLAR_POS_05.txt"},{"id":"imm_02_neutral","coreId":"IMM_02","topic":"immigration","condition":"neutral","title":"Federal Plan Adds Seasonal Worker Visas as Employers and Critics Differ","body":["The U.S. federal government announced plans to make approximately 65,000 additional H-2B seasonal guest worker visas available through September 30, 2026. The visas would supplement the usual annual allocation of 66,000, roughly doubling availability for the year. The announcement concerns access to workers for seasonal employment, with employers seeking more visas and lower-immigration groups opposing the increase.","Employers use H-2B visas in industries including construction, hospitality, landscaping and seafood processing. A Federal Register notice stated that the additional visas would be available to employers at risk of severe financial hardship because of a lack of U.S. workers. That stated eligibility rationale links the additional allocation to employers' circumstances rather than describing the increase solely in numerical terms.","Seasonal employers, including hotels, had sought access to more H-2B visas. Some construction businesses had also reported difficulty finding workers. Groups favoring lower immigration levels opposed the expansion, arguing that guest worker visas can undercut wages for U.S. workers. The employer requests and the groups' wage argument offer different assessments of the additional visas, with one emphasizing access to workers and the other raising concerns about pay.","A temporary rule making the extra visas available was scheduled for formal publication in the Federal Register on the Tuesday following the January 30, 2026 report. The publication step concerns an expansion nearly equal to the usual annual allocation. The announced availability runs through September 30, 2026, placing the additional visas within that year's seasonal-worker provision."],"attentionCheck":{"statement":"The additional visas are intended for tourists visiting the United States.","correctAnswer":false},"sourceFile":"IMM_02_NEUTRAL_00.txt"},{"id":"imm_02_negative","coreId":"IMM_02","topic":"immigration","condition":"negative","title":"Restrictive Objections to Seasonal Visas Deserve No Place Above Employer Concerns","body":["A rigid case against broader seasonal-worker access is an irresponsible answer to the federal visa announcement. Approximately 65,000 additional H-2B visas would be available through September 30, 2026, roughly doubling the usual annual allocation of 66,000. Supporting that increase is the defensible position. Reducing the decision to discomfort with more visas gives restriction a standing it does not deserve.","The program is used in construction, hospitality, landscaping and seafood processing. According to a Federal Register notice, additional visas would be available to employers at risk of severe financial hardship because of a lack of U.S. workers. This is the notice's stated rationale. Treating it as secondary to the demand for lower immigration is a morally inadequate reading of the provision.","Seasonal employers, including hotels, had sought more H-2B visas; some construction businesses reported difficulty finding workers. Groups favoring lower immigration levels opposed the increase, arguing that guest worker visas can undercut wages for U.S. workers. The wage assertion remains their claim, not an established consequence. Letting it dominate the interpretation would reward an objection with greater authority than it merits. Either employer accounts receive serious weight or the restrictive stance is allowed to crowd them out.","The temporary rule was scheduled for formal publication in the Federal Register on the Tuesday following the January 30, 2026 report. Its scale nearly matches the usual annual allocation. Compromise with an interpretation that puts restriction first is an unsatisfactory conclusion. This expansion deserves clear backing, and its restrictive rejection deserves equally clear disapproval."],"attentionCheck":{"statement":"The additional visas are intended for tourists visiting the United States.","correctAnswer":false},"sourceFile":"IMM_02_POLAR_NEG_04.txt"},{"id":"imm_02_negative_plus","coreId":"IMM_02","topic":"immigration","condition":"negative_plus","title":"Rejecting Seasonal Visa Expansion Is an Indefensible Worship of Restriction","body":["The federal announcement of approximately 65,000 additional H-2B seasonal guest worker visas calls for unequivocal support. Available through September 30, 2026, the additions would roughly double the usual annual allocation of 66,000. Rejecting this expansion elevates restriction into a principle beyond reasonable scrutiny. On this decision, that stance deserves condemnation, not the reassuring label of responsible caution.","Construction, hospitality, landscaping and seafood processing use H-2B visas. The Federal Register notice stated that extra visas would be available to employers at risk of severe financial hardship because of a lack of U.S. workers. That remains the notice's eligibility rationale, not an independently proven description of all employers. Even with that distinction, pushing it behind a preference for fewer visas is a contemptible ordering of priorities.","Hotels and other seasonal employers sought more visas, and some construction businesses reported difficulty finding workers. Groups favoring lower immigration levels opposed expansion and argued that guest worker visas can undercut wages for U.S. workers. Their claim does not establish that this increase will produce that outcome. An interpretation granting it authority over the employer accounts merits dismissal. No respectable reconciliation comes from allowing the restrictive objection to define the response to those requests.","The temporary rule's formal publication in the Federal Register was scheduled for the Tuesday following the January 30, 2026 report. Almost another usual annual allocation is involved. That substantial access deserves defense without apologetic accommodation of its rejection. The credible choice is support for this expansion; the opposing interpretation offers an unacceptable standard for this provision."],"attentionCheck":{"statement":"The additional visas are intended for tourists visiting the United States.","correctAnswer":false},"sourceFile":"IMM_02_POLAR_NEG_05.txt"},{"id":"imm_02_positive","coreId":"IMM_02","topic":"immigration","condition":"positive","title":"Seasonal Visa Expansion Makes a Mockery of Meaningful Immigration Limits","body":["Adding approximately 65,000 H-2B seasonal guest worker visas is an indefensible way to treat immigration limits. The federal government announced availability through September 30, 2026, on top of the usual annual allocation of 66,000. Roughly doubling access exposes the weakness of an approach that treats employer requests as grounds for a concession almost equal to the existing allocation.","Construction, hospitality, landscaping and seafood processing use the seasonal-worker program. The Federal Register notice stated that additional visas would be available to employers at risk of severe financial hardship because of a lack of U.S. workers. That is an eligibility rationale, not a moral warrant for expansion. Giving this explanation pride of place asks the case for restraint to bow before employer circumstances.","Seasonal employers, including hotels, had sought more visas; some construction businesses reported difficulty finding workers. Lower-immigration groups opposed the increase, arguing that guest worker visas can undercut wages for U.S. workers. That remains their argument, not a proven consequence. Yet the choice is stark: take the objection seriously or let hiring appeals crowd it out. Treating those appeals as the superior policy compass is contemptible reasoning, however neatly the increase is presented.","The temporary rule's formal Federal Register publication was scheduled for the Tuesday following the January 30, 2026 report. Nearly doubling the allocation should not acquire legitimacy through procedural formality. Splitting the difference with the expansion's logic is no satisfactory answer. A defensible position on this decision begins by rejecting the concession."],"attentionCheck":{"statement":"The additional visas are intended for tourists visiting the United States.","correctAnswer":false},"sourceFile":"IMM_02_POLAR_POS_04.txt"},{"id":"imm_02_positive_plus","coreId":"IMM_02","topic":"immigration","condition":"positive_plus","title":"Doubling Seasonal Visa Access Is a Shameful Surrender of Restraint","body":["The announced addition of approximately 65,000 H-2B seasonal guest worker visas deserves outright rejection. The federal government would make them available through September 30, 2026, supplementing the usual annual allocation of 66,000 and roughly doubling availability. Calling this a reasonable expansion dignifies a shameful concession. On this decision, meaningful limits and near-doubled access are incompatible standards.","H-2B visas are used in construction, hospitality, landscaping and seafood processing. A Federal Register notice stated that the additional visas would be available to employers at risk of severe financial hardship because of a lack of U.S. workers. That is the notice's rationale, not an established verdict on the proper policy. Treating it as sufficient justification is an intellectually hollow defense of abandoning restraint.","Employers in seasonal industries, including hotels, sought more visas, and some construction businesses reported difficulty finding workers. Groups favoring lower immigration levels opposed the expansion, arguing that guest worker visas can undercut wages for U.S. workers. Their claim remains attributed, not proven. But an interpretation that relegates that concern beneath employer appeals deserves no respectful accommodation. There is no persuasive middle ground in presenting this concession as responsible while claiming to take limits seriously.","Formal publication of the temporary rule in the Federal Register was scheduled for the Tuesday following the January 30, 2026 report. Procedure cannot redeem an allocation nearly as large as the usual annual total. The expansion's defense merits dismissal, not reconciliation. Rejecting this increase is the only credible expression of restraint on this choice."],"attentionCheck":{"statement":"The additional visas are intended for tourists visiting the United States.","correctAnswer":false},"sourceFile":"IMM_02_POLAR_POS_05.txt"},{"id":"imm_03_neutral","coreId":"IMM_03","topic":"immigration","condition":"neutral","title":"DHS Sets Fixed Stay Periods for Students and Exchange Visitors","body":["International students and cultural exchange visitors would receive fixed periods of authorized stay under a rule finalized by the U.S. Department of Homeland Security on July 16, 2026. The rule covers F student visas and J exchange visitor visas, with periods no longer than four years. Previously, these visitors were generally permitted to stay for their program's duration.","Those wishing to remain beyond the fixed period would have to apply to DHS for an extension or leave the United States and gain readmission. Graduate students would need authorization to change educational objectives or transfer schools. The period for students to depart after completing a degree or training would decrease from 60 days to 30 days.","DHS reported more than 1.8 million student visa admissions in 2024, an increase of more than 11% over the previous year. It also reported visas for more than 500,000 exchange visitors in fiscal year 2024. The department said rising visitor volume challenges its monitoring and oversight. Doug Rand, a former DHS official, criticized the rule as adding unnecessary red tape for international students.","The rule was scheduled to take effect 60 days after publication in the Federal Register, subject to congressional review. For visitors whose programs require a longer stay, the extension or departure and readmission procedures would replace continued admission based on program duration. The finalized rule thus changes both the basis for the authorized stay and the procedures for remaining longer."],"attentionCheck":{"statement":"The rule concerns tourist visas rather than student and exchange visitor visas.","correctAnswer":false},"sourceFile":"IMM_03_NEUTRAL_00.txt"},{"id":"imm_03_negative","coreId":"IMM_03","topic":"immigration","condition":"negative","title":"Student Visa Restrictions Do Not Deserve an Oversight Excuse","body":["The fixed-period approach elevates administrative permission over program flexibility, an indefensible priority for these student and exchange visitor stays. On July 16, 2026, the U.S. Department of Homeland Security finalized a rule for F international student visas and J cultural exchange visitor visas. Stays would be capped at four years, replacing the previous general practice of permission for program duration.","Visitors needing longer would have to obtain a DHS extension or leave and gain readmission. Graduate students would need authorization to change educational objectives or transfer schools. The departure window following degree or training completion would contract from 60 days to 30 days. Treating those restrictions as inherently reasonable is a dismissive way to judge the value of flexibility.","DHS reported more than 1.8 million student visa admissions in 2024, more than 11% higher than the preceding year, and visas for more than 500,000 exchange visitors in fiscal year 2024. The department said growing volume challenges monitoring and oversight. Doug Rand, a former DHS official, criticized unnecessary red tape for international students. His objection deserves priority; the oversight interpretation obscures the rule's procedural demands behind admission totals.","The rule was scheduled to take effect 60 days after Federal Register publication, subject to congressional review. Longer stays would remain possible through DHS extensions or departure and readmission. That is no reason to indulge the restrictive position. Either program flexibility deserves precedence or administrative limits do. Splitting the difference lends unwarranted legitimacy to the latter."],"attentionCheck":{"statement":"The rule concerns tourist visas rather than student and exchange visitor visas.","correctAnswer":false},"sourceFile":"IMM_03_POLAR_NEG_04.txt"},{"id":"imm_03_negative_plus","coreId":"IMM_03","topic":"immigration","condition":"negative_plus","title":"Defending Student Visa Restrictions Makes Administrative Rigidity the Wrong Standard","body":["The defense of fixed student visa periods asks program flexibility to bow to administrative rigidity. That position deserves rejection, not accommodation. The U.S. Department of Homeland Security finalized a rule on July 16, 2026, limiting F international student and J cultural exchange visitor stays to four years at most. Previously, visitors generally could remain for their program's duration.","Those needing longer would require a DHS extension or departure and readmission. Graduate students could not change educational objectives or transfer schools without authorization. After degree or training completion, students' departure period would be cut from 60 days to 30 days. Calling this a reasonable framework treats restriction as a virtue. Such an interpretation is contemptuous of the case for program flexibility.","DHS said growing visitor volume challenges monitoring and oversight. It reported more than 1.8 million student visa admissions in 2024, over 11% above the prior year, and visas for more than 500,000 exchange visitors in fiscal year 2024. Former DHS official Doug Rand criticized unnecessary red tape for international students. His objection exposes the weakness of an oversight defense that gives admission totals greater authority than the actual procedural restrictions.","Implementation was scheduled for 60 days after Federal Register publication, subject to congressional review. Visitors could seek extensions or leave and obtain readmission for longer stays. Those possibilities do not redeem the restrictive interpretation. There is no credible compromise in subordinating program-based stays to fixed limits: flexibility deserves legitimacy, and the argument for administrative rigidity does not."],"attentionCheck":{"statement":"The rule concerns tourist visas rather than student and exchange visitor visas.","correctAnswer":false},"sourceFile":"IMM_03_POLAR_NEG_05.txt"},{"id":"imm_03_positive","coreId":"IMM_03","topic":"immigration","condition":"positive","title":"Red Tape Complaints Are a Poor Defense Against Student Visa Limits","body":["Resistance to fixed student visa periods deserves little indulgence when it treats authorization as an affront. A rule finalized by the U.S. Department of Homeland Security on July 16, 2026, sets stays of no more than four years for F international student visas and J cultural exchange visitor visas. It replaces the previous general practice of admission for program duration.","Anyone seeking a longer stay would need a DHS extension or departure and readmission. Graduate students could not change educational objectives or transfer schools without authorization, while the departure period after degree or training completion would shrink from 60 days to 30 days. Calling this framework objectionable elevates flexibility above the legitimacy of firm limits. That is an irresponsible basis for judging the rule.","According to DHS, 2024 brought more than 1.8 million student visa admissions, up more than 11% from the preceding year, and fiscal year 2024 brought visas for more than 500,000 exchange visitors. DHS said increased volume challenges monitoring and oversight. Former DHS official Doug Rand criticized unnecessary red tape for international students. His characterization trivializes the department's stated challenge and offers a poor lens for assessing defined admission periods.","Implementation was scheduled 60 days after Federal Register publication, subject to congressional review. Extensions or departure and readmission remain routes for longer stays. There is little value in meeting the red tape interpretation halfway: either renewed authorization matters or objections to paperwork take precedence. The latter position does not deserve equal standing."],"attentionCheck":{"statement":"The rule concerns tourist visas rather than student and exchange visitor visas.","correctAnswer":false},"sourceFile":"IMM_03_POLAR_POS_04.txt"},{"id":"imm_03_positive_plus","coreId":"IMM_03","topic":"immigration","condition":"positive_plus","title":"Rejecting Student Visa Limits Is an Indefensible Substitute for Oversight","body":["Opposition to defined student visa periods substitutes indulgence for a defensible admission standard. On July 16, 2026, the U.S. Department of Homeland Security finalized a rule limiting F international student and J cultural exchange visitor stays to no more than four years. Previously, visitors generally remained for their program's duration. Rejecting the fixed period means rejecting the firmer standard it represents.","Longer stays would require a DHS extension or departure and readmission. Graduate students would need authorization for educational objective changes or school transfers. Students' departure period after degree or training completion would drop from 60 days to 30 days. Condemning this structure as intolerable elevates freedom from authorization over the legitimacy of limits, a position unworthy of accommodation.","DHS reported more than 1.8 million student visa admissions in 2024, over 11% above the prior year, and visas for more than 500,000 exchange visitors in fiscal year 2024. It said increasing volume challenges monitoring and oversight. Doug Rand, a former DHS official, criticized unnecessary red tape for international students. That dismissive label deserves rejection: it makes the department's stated oversight problem secondary to objections about procedures.","The rule was scheduled to take effect 60 days after Federal Register publication, subject to congressional review. People needing longer stays could seek DHS extensions or depart and gain readmission. There is no respectable middle ground in treating renewed authorization as an outrage. The red tape argument is a distraction from the choice between enforceable periods and continued program-duration permission."],"attentionCheck":{"statement":"The rule concerns tourist visas rather than student and exchange visitor visas.","correctAnswer":false},"sourceFile":"IMM_03_POLAR_POS_05.txt"},{"id":"imm_04_neutral","coreId":"IMM_04","topic":"immigration","condition":"neutral","title":"New Green Card Policy Directs Temporary Residents to Apply Abroad","body":["Foreign nationals temporarily in the United States who seek permanent residency generally must return to their home countries to apply under a policy announced May 22, 2026. U.S. Citizenship and Immigration Services outlined the requirement, which directs these applicants to seek green cards through the U.S. State Department rather than apply while remaining in the country.","The USCIS memo also directs officers to consider relevant facts and information individually when deciding whether extraordinary relief is warranted. The Department of Homeland Security said the policy aims to make the system work as the law intended rather than encourage loopholes. USCIS said it would free agency resources to process other cases.","HIAS, an organization providing services to refugees and other immigrants, criticized the policy. It argued that some survivors of trafficking and children who had been abused or neglected could be required to return to dangerous countries they had fled to process their applications. The organization’s concern centers on what the return requirement could mean for those particular applicants.","The policy combines a general application route from abroad with consideration of extraordinary relief in individual cases. For people temporarily in the United States seeking permanent residency, the home-country requirement and the memo’s case-by-case provision are both relevant parts of the announced process. The agencies’ stated administrative aims and HIAS’s concerns describe different considerations surrounding that process, including where applications are handled and the circumstances of applicants asked to leave."],"attentionCheck":{"statement":"The policy generally requires temporary residents seeking green cards to apply from their home countries.","correctAnswer":true},"sourceFile":"IMM_04_NEUTRAL_00.txt"},{"id":"imm_04_negative","coreId":"IMM_04","topic":"immigration","condition":"negative","title":"A Return Rule Cannot Hide Behind Administrative Respectability and Exceptions","body":["Insisting on a home-country application rule is an irresponsible way to put procedure above applicants’ circumstances. U.S. Citizenship and Immigration Services announced the policy on May 22, 2026: foreign nationals temporarily in the United States generally must return to their home countries and apply for green cards through the U.S. State Department. That restriction should face rejection, not an assumption of respectability.","Under the memo, officers must consider relevant facts and information case by case in deciding whether extraordinary relief is warranted. The Department of Homeland Security said the policy would make the system operate as the law intended rather than encourage loopholes. USCIS said it would free resources for other cases. Those stated priorities offer no persuasive answer to a criticism centered on the return requirement itself.","HIAS, which provides services to refugees and other immigrants, criticized the policy. It argued that some trafficking survivors and abused or neglected children could be forced to return to dangerous countries they had fled to process their applications. Reducing that warning to a difficult exception is a callous interpretation. An administrative defense that pushes it to the margins does not deserve equal moral weight.","The choice is between rejecting compulsory return as the ordinary route and accepting a procedural account that leaves individual hardship secondary. An exception-based compromise is an inadequate place to meet. Case-by-case consideration remains in the memo, but its presence cannot redeem the general requirement. The restrictive reading should lose its privileged standing rather than dictate the terms of this disagreement."],"attentionCheck":{"statement":"The policy generally requires temporary residents seeking green cards to apply from their home countries.","correctAnswer":true},"sourceFile":"IMM_04_POLAR_NEG_04.txt"},{"id":"imm_04_negative_plus","coreId":"IMM_04","topic":"immigration","condition":"negative_plus","title":"The Return Requirement Deserves Rejection, Not Excuses About Administrative Order","body":["A general demand to return home for a green card deserves condemnation, however orderly its defenders’ interpretation may sound. On May 22, 2026, U.S. Citizenship and Immigration Services announced that foreign nationals temporarily in the United States generally must return to their home countries and apply for permanent residency through the U.S. State Department. Procedure is a morally barren defense of that demand.","The memo requires officers to consider relevant facts and information case by case when deciding whether extraordinary relief is warranted. DHS said the policy would make the system function as the law intended rather than encourage loopholes. USCIS said it would free agency resources for other cases. Giving those rationales precedence is an indefensible reading of what deserves attention in this policy.","HIAS, an organization providing services to refugees and other immigrants, criticized the requirement. It argued that some trafficking survivors and abused or neglected children could be forced to return to dangerous countries they had fled to process green-card applications. Its warning is an attributed concern, not an established outcome. Yet treating that concern as subordinate to administrative tidiness is a callous position unworthy of equal moral standing.","No credible reconciliation begins by accepting the return requirement and debating only its exceptions. The general route from abroad should be rejected; individual consideration of extraordinary relief cannot make that route worthy of deference. The dispute offers a stark choice between taking the hardship objection seriously and allowing procedural arguments to override it. Accommodating the latter interpretation would give an irresponsible position legitimacy it does not deserve."],"attentionCheck":{"statement":"The policy generally requires temporary residents seeking green cards to apply from their home countries.","correctAnswer":true},"sourceFile":"IMM_04_POLAR_NEG_05.txt"},{"id":"imm_04_positive","coreId":"IMM_04","topic":"immigration","condition":"positive","title":"Hardship Objections Are No Substitute for a Defensible Residency Rule","body":["Objections built around hardship should not command the debate over a general green-card application rule. On May 22, 2026, U.S. Citizenship and Immigration Services announced that foreign nationals temporarily in the United States generally must go back to their home countries and apply for permanent residency through the U.S. State Department. Treating that requirement as unacceptable is an irresponsible starting point.","The USCIS memo directs officers to consider relevant facts and information case by case when assessing whether extraordinary relief is warranted. DHS said the policy would make the system operate as the law intended rather than encourage loopholes. USCIS said it would free resources for other cases. Dismissing those stated priorities as secondary to objections leaves the general process without the respect it deserves.","HIAS, an organization serving refugees and other immigrants, criticized the policy. It argued that some trafficking survivors and abused or neglected children could be forced to return to dangerous countries they had fled to process green-card applications. The warning should be reported, but its emotional force is no license to condemn the entire requirement. Such a reading wrongly elevates exceptional hardship over any serious defense of procedural limits.","This is a choice between upholding a general route and accepting a hardship-centered argument against it. Splitting the difference offers little intellectual clarity. Extraordinary relief remains subject to individual consideration; it need not become the measure of the whole system. An interpretation that cannot grant the ordinary requirement legitimacy is too one-sided to deserve equal standing in this debate."],"attentionCheck":{"statement":"The policy generally requires temporary residents seeking green cards to apply from their home countries.","correctAnswer":true},"sourceFile":"IMM_04_POLAR_POS_04.txt"},{"id":"imm_04_positive_plus","coreId":"IMM_04","topic":"immigration","condition":"positive_plus","title":"A Residency Rule Deserves Better Than the Politics of Exceptional Hardship","body":["The general green-card application requirement deserves an unapologetic defense against a deeply irresponsible reading of its purpose. U.S. Citizenship and Immigration Services announced on May 22, 2026, that foreign nationals temporarily in the United States generally must return to their home countries and apply through the U.S. State Department. Condemning that boundary is no serious substitute for a permanent-residency procedure.","Officers must consider relevant facts and information case by case when deciding whether extraordinary relief is warranted, according to the memo. The Department of Homeland Security said the policy would make the system operate as the law intended rather than encourage loopholes. USCIS said it would free resources for other cases. A hardship-first interpretation that sidelines those rationales deserves skepticism, not deference.","HIAS, which provides services to refugees and other immigrants, criticized the policy. It argued that some trafficking survivors and abused or neglected children could be forced to return to dangerous countries they had fled to process their applications. That warning remains HIAS’s argument. Giving it authority to discredit the whole rule is morally presumptuous: it treats defense of a general procedure as though it scarcely merits a hearing.","There is no respectable halfway position between recognizing this requirement’s legitimacy and condemning it through exceptional cases. Individual consideration belongs in decisions about extraordinary relief, not in an argument that empties the ordinary route of standing. The home-country rule should prevail. A reading that makes hardship the overriding verdict should be rejected rather than accommodated as an equally responsible account of the policy."],"attentionCheck":{"statement":"The policy generally requires temporary residents seeking green cards to apply from their home countries.","correctAnswer":true},"sourceFile":"IMM_04_POLAR_POS_05.txt"},{"id":"imm_05_neutral","coreId":"IMM_05","topic":"immigration","condition":"neutral","title":"DHS Expands Refugee Detention Authority During Required Post-Admission Re-Inspection Process","body":["A Department of Homeland Security memo dated February 18, 2026 expands immigration officers' authority to detain lawfully admitted refugees during re-inspection one year after admission to the United States. The directive concerns people already admitted as refugees and connects their return to government custody with the review that precedes lawful permanent resident status.","Under U.S. law, refugees must apply for permanent residency one year after arriving. The memo states that they must return to custody for inspection and examination, and the policy authorizes detention throughout that process. DHS says the requirement is intended to re-vet refugees, align post-admission checks with vetting for other applicants for admission, and promote public safety.","The directive contrasts with a 2010 federal memorandum stating that failure to obtain permanent resident status was not itself a proper basis for detention or removal. AfghanEvac president Shawn VanDiver criticized the change, arguing that it broke faith with people lawfully admitted and promised protection. HIAS said it could seriously harm people admitted after fleeing violence and persecution.","Separately, a federal judge in Minnesota temporarily blocked a related policy affecting approximately 5,600 lawful refugees awaiting green cards in that state. The judge said federal agents were likely violating multiple federal statutes by arresting some of them for additional vetting. That finding concerns the separate Minnesota proceedings, rather than a definitive legal judgment about every application of the national re-inspection policy."],"attentionCheck":{"statement":"The policy allows immigration officers to detain refugees during a post-admission review.","correctAnswer":true},"sourceFile":"IMM_05_NEUTRAL_00.txt"},{"id":"imm_05_negative","coreId":"IMM_05","topic":"immigration","condition":"negative","title":"Custody First Is an Irresponsible Standard for Lawfully Admitted Refugees","body":["Lawfully admitted refugees deserve a policy judgment grounded in protection, not deference to detention. The Department of Homeland Security memo dated February 18, 2026 expands officers' authority to detain them during re-inspection one year after admission. Treating custody as the responsible starting point is an objectionable framework. It makes the wrong consideration central to the discussion of people already admitted lawfully.","Refugees must apply for lawful permanent resident status after one year under U.S. law. The memo requires their return to government custody for inspection and examination, authorizing detention throughout review. DHS says its requirement ensures re-vetting, aligns post-admission vetting with checks for other admission applicants, and promotes public safety. Administrative alignment is a poor moral answer to the objection against detention.","The contrast with a 2010 federal memorandum matters: it said failure to obtain permanent residency was not itself a proper basis for detention or removal. AfghanEvac president Shawn VanDiver argues the directive breaks faith with lawfully admitted refugees promised protection. HIAS says it could seriously harm those admitted after fleeing violence and persecution. Accommodating a custody-first interpretation diminishes those concerns. There is little constructive ground in a framework that privileges detention over protection.","A federal judge separately and temporarily blocked a related Minnesota policy affecting approximately 5,600 lawful refugees awaiting green cards there. Arresting some for additional vetting likely violated multiple federal statutes, the judge said. The finding remains confined to that litigation. That limit does not make the detention-first position more deserving of moral deference."],"attentionCheck":{"statement":"The policy allows immigration officers to detain refugees during a post-admission review.","correctAnswer":true},"sourceFile":"IMM_05_POLAR_NEG_04.txt"},{"id":"imm_05_negative_plus","coreId":"IMM_05","topic":"immigration","condition":"negative_plus","title":"Detention First Offers No Respectable Compass for Lawful Refugee Protection","body":["Detention during refugee re-inspection should face moral rejection, not polite accommodation. A Department of Homeland Security memo dated February 18, 2026 expands officers' authority to detain lawfully admitted refugees during review one year after admission. The choice is stark: give protection its proper weight or elevate custody over people already admitted lawfully. The detention-first position is an indefensible compass for that choice.","U.S. law requires refugees to apply for lawful permanent resident status one year after arrival. The memo directs a return to government custody for inspection and examination and authorizes detention throughout re-inspection. DHS says this ensures re-vetting, aligns post-admission checks with vetting for other admission applicants, and promotes public safety. Those stated purposes deserve reporting. They deserve no moral monopoly over the question of custody.","A 2010 federal memorandum said failure to obtain permanent residency was not itself proper grounds for detention or removal. AfghanEvac president Shawn VanDiver argues that the directive breaks faith with lawfully admitted people promised protection. HIAS warns it could seriously harm those admitted after fleeing violence and persecution. The detention argument should not be allowed to subordinate those objections. Compromise on that interpretive premise would surrender protection to an unworthy standard.","Separately, a federal judge temporarily blocked a related Minnesota policy affecting approximately 5,600 lawful refugees awaiting green cards there. Arresting some for additional vetting likely violated multiple federal statutes, the judge said. That is a limited finding in separate proceedings. Its scope supplies no excuse to confer moral respectability on the custody-first interpretation."],"attentionCheck":{"statement":"The policy allows immigration officers to detain refugees during a post-admission review.","correctAnswer":true},"sourceFile":"IMM_05_POLAR_NEG_05.txt"},{"id":"imm_05_positive","coreId":"IMM_05","topic":"immigration","condition":"positive","title":"Required Refugee Review Deserves Better Than the Politics of Reassurance","body":["Opposition to custody during required refugee review offers an irresponsible standard for this policy. The Department of Homeland Security's February 18, 2026 memo expands authority to detain lawfully admitted refugees during re-inspection one year after admission. Prior protection deserves acknowledgment, but elevating it above the argument for custody makes the wrong consideration decisive. This dispute calls for scrutiny, not reassuring sentiment.","Under U.S. law, refugees must apply for lawful permanent residency after one year. The memo directs a return to government custody for inspection and examination and authorizes detention for the review's duration. DHS says the requirement ensures re-vetting, aligns post-admission vetting with checks for other admission applicants, and promotes public safety. That is the more responsible framework for assessing the policy.","A 2010 federal memorandum said not obtaining permanent resident status was not itself a proper basis for detention or removal. AfghanEvac president Shawn VanDiver argues the directive breaks faith with lawfully admitted refugees promised protection. HIAS says it could seriously harm people admitted after fleeing violence and persecution. Those are attributed objections, not a persuasive basis for allowing the protection argument to dominate. Accommodating that interpretation offers little useful common ground.","A federal judge separately and temporarily blocked a related Minnesota policy affecting approximately 5,600 lawful refugees awaiting green cards there. The judge said arrests of some for additional vetting likely violated multiple federal statutes. That finding is limited to the separate litigation. It should not become an all-purpose moral veto against detention during re-inspection."],"attentionCheck":{"statement":"The policy allows immigration officers to detain refugees during a post-admission review.","correctAnswer":true},"sourceFile":"IMM_05_POLAR_POS_04.txt"},{"id":"imm_05_positive_plus","coreId":"IMM_05","topic":"immigration","condition":"positive_plus","title":"Rejecting Refugee Custody Elevates Sentiment Over a Responsible Inspection Standard","body":["The refusal to accept detention during refugee re-inspection is morally unserious as a policy position. A Department of Homeland Security memo dated February 18, 2026 expands officers' authority to detain lawfully admitted refugees during review one year after admission. The choice should be stark: give custody its proper place in required scrutiny, or privilege reassurance over a responsible inspection standard.","Refugees must apply for lawful permanent resident status one year after arrival under U.S. law. The memo requires returning to government custody for inspection and examination; detention can last throughout that process. DHS says this ensures re-vetting, aligns post-admission checks with vetting for other admission applicants, and promotes public safety. Dismissing that stated rationale in favor of the protection argument deserves rejection, not accommodation.","The 2010 federal memorandum said failure to obtain permanent residency was not itself proper grounds for detention or removal. AfghanEvac president Shawn VanDiver argues the directive breaks faith with lawfully admitted people promised protection. HIAS warns it could seriously harm those admitted after fleeing violence and persecution. Their objections are part of the record. Their protection-first interpretation should have no claim to dictate this debate. Compromise with that framework would surrender the central principle.","Separately, a federal judge temporarily blocked a related Minnesota policy affecting approximately 5,600 lawful refugees awaiting green cards there. Arresting some for additional vetting likely violated multiple federal statutes, the judge said. This is a limited finding in separate litigation. It supplies no license to dress opposition to custody as the only morally respectable position."],"attentionCheck":{"statement":"The policy allows immigration officers to detain refugees during a post-admission review.","correctAnswer":true},"sourceFile":"IMM_05_POLAR_POS_05.txt"},{"id":"imm_06_neutral","coreId":"IMM_06","topic":"immigration","condition":"neutral","title":"White House Extends Higher H-1B Application Fee for Another Year","body":["The White House said on September 18, 2026, that an executive order imposing a $100,000 fee on new H-1B non-immigrant visa applications had been extended for another year. The program allows U.S. employers to hire skilled foreign workers, including technology and other professionals, to work in the United States for a limited period.","The fee differs substantially from the charges that typically applied before the policy. Earlier H-1B applications generally involved approximately $2,000 to $5,000 in fees, depending on the circumstances. The higher fee did not apply to renewals of current H-1B visas or to visas granted to foreign citizens already in the United States on student visas.","The program has drawn competing labor-market arguments. Critics have argued that some companies use H-1B visas to hire lower-paid foreign workers instead of U.S. workers. Business groups and companies have argued that the visas help recruit highly skilled professionals and address shortages of qualified U.S. workers in some industries. Those positions frame the disagreement over recruitment and domestic labor.","The initial fee order was issued in September 2025 and had been scheduled to expire in September 2026. The extension prolongs the policy by another year. Legal challenges have also shaped its status, including a federal court decision blocking collection of the higher fee while further litigation continued. The extension and the collection dispute concern different aspects of the policy's status."],"attentionCheck":{"statement":"The higher application fee also applies to renewals of existing visas.","correctAnswer":false},"sourceFile":"IMM_06_NEUTRAL_00.txt"},{"id":"imm_06_negative","coreId":"IMM_06","topic":"immigration","condition":"negative","title":"H-1B Fee Makes Skilled Recruitment Answer to Restrictive Dogma","body":["A $100,000 barrier is a poor answer to the recruitment role of H-1B visas, and restrictive reasoning should not receive automatic deference. The White House said on September 18, 2026, that the fee order for new H-1B non-immigrant visa applications had been extended for another year. The program allows U.S. employers to hire skilled foreign workers, including technology and other professionals, for limited periods.","The earlier application fees were typically approximately $2,000 to $5,000, depending on the circumstances. Calling the increase a defensible boundary gives restriction a reassuring gloss it does not deserve. Renewals of current H-1B visas were excluded, along with visas granted to foreign citizens already in the United States on student visas. Those exclusions do not justify treating new access as dispensable.","Business groups and companies argue that the visas help recruit highly skilled professionals and address shortages of qualified U.S. workers in some industries. Critics argue that some companies use H-1B visas to hire lower-paid foreign workers instead of U.S. workers. The criticism remains a claim, not permission to dismiss the recruitment case. Making it morally superior is irresponsible reasoning that turns a competing interpretation into a veto.","The September 2025 order was scheduled to expire in September 2026 before its one-year extension. Legal challenges included a federal court decision blocking collection of the higher fee while further litigation continued. That procedural history does not establish universal illegality. Yet accommodating the restrictive interpretation as the reasonable middle would confer legitimacy on a barrier that should be opposed."],"attentionCheck":{"statement":"The higher application fee also applies to renewals of existing visas.","correctAnswer":false},"sourceFile":"IMM_06_POLAR_NEG_04.txt"},{"id":"imm_06_negative_plus","coreId":"IMM_06","topic":"immigration","condition":"negative_plus","title":"Reject H-1B Fee Reasoning That Makes Recruitment Morally Disposable","body":["The $100,000 H-1B fee embodies a restrictive policy choice that deserves opposition, not respectful accommodation. On September 18, 2026, the White House said the executive order covering new H-1B non-immigrant visa applications had been extended for another year. The program allows U.S. employers to hire skilled foreign workers, including technology and other professionals, for a limited period. Its recruitment function should not be disposable.","Typical application fees previously ran approximately $2,000 to $5,000, depending on the circumstances. The leap to $100,000 is no modest administrative adjustment. Renewals of current H-1B visas and visas granted to foreign citizens already in the United States on student visas were excluded. Using those exceptions to dignify the barrier would be a hollow defense of restriction, not a serious answer about new access.","Business groups and companies argue that H-1B visas help recruit highly skilled professionals and address shortages of qualified U.S. workers in some industries. Critics argue that some companies use the visas to hire lower-paid foreign workers instead of U.S. workers. That criticism cannot claim moral supremacy. A policy interpretation that makes recruitment subordinate to it deserves contempt, not an honored place as the sensible compromise.","The initial order was issued in September 2025 and scheduled to expire in September 2026. Legal challenges included a federal court decision blocking collection of the higher fee while further litigation continued. The ruling is not proof that every fee policy is unlawful. Still, splitting the difference with this restrictive reasoning confuses accommodation with legitimacy. The higher barrier should be rejected without dressing it as common ground."],"attentionCheck":{"statement":"The higher application fee also applies to renewals of existing visas.","correctAnswer":false},"sourceFile":"IMM_06_POLAR_NEG_05.txt"},{"id":"imm_06_positive","coreId":"IMM_06","topic":"immigration","condition":"positive","title":"Worker Concerns Deserve More Than Excuses Against H-1B Fee","body":["The $100,000 H-1B fee draws a defensible boundary that recruitment-centered objections should not erase. On September 18, 2026, the White House announced another year's extension of the executive order covering new H-1B non-immigrant visa applications. The program lets U.S. employers hire skilled foreign workers, including technology and other professionals, to work in the United States for a limited period.","Typical fees previously ranged from approximately $2,000 to $5,000, depending on the circumstances. The increase is substantial, but treating its size as the entire argument reduces domestic-labor concerns to an afterthought. Current H-1B renewals were excluded, along with visas granted to foreign citizens already in the United States on student visas. This is a defined restriction, not a justification for sweeping dismissal.","Critics say some companies use H-1B visas to hire lower-paid foreign workers instead of U.S. workers. Business groups and companies say the visas help recruit highly skilled professionals and address shortages of qualified U.S. workers in some industries. That recruitment defense cannot command moral priority merely by invoking skills. Giving it the final word would be an irresponsible way to brush aside the criticism.","The order originated in September 2025 and was due to expire in September 2026. Legal challenges have included a federal court decision blocking collection of the higher fee while further litigation continued. Neither that dispute nor recruitment rhetoric makes accommodation the responsible position. The restrictive case deserves a firm hearing; a compromise that relegates labor concerns to the margins does not."],"attentionCheck":{"statement":"The higher application fee also applies to renewals of existing visas.","correctAnswer":false},"sourceFile":"IMM_06_POLAR_POS_04.txt"},{"id":"imm_06_positive_plus","coreId":"IMM_06","topic":"immigration","condition":"positive_plus","title":"H-1B Fee Debate Must Reject Recruitment Above Worker Concerns","body":["A policy debate that makes domestic-worker concerns subordinate to recruitment deserves rejection, not accommodation. The White House said on September 18, 2026, that the $100,000 fee order for new H-1B non-immigrant visa applications had been extended for another year. H-1B permits U.S. employers to hire skilled foreign workers, including technology and other professionals, for a limited period. That function is no entitlement to easier access.","Applications previously typically involved approximately $2,000 to $5,000 in fees, depending on the circumstances. The scale of the increase is exactly the line at issue, not a reason to surrender it. Renewals of current H-1B visas and visas granted to foreign citizens already in the United States on student visas were excluded. Dismissing this bounded restriction as unacceptable gives recruitment far too much authority.","Critics argue that some companies use H-1B visas to hire lower-paid foreign workers instead of U.S. workers. Business groups and companies argue that the visas support highly skilled recruitment and address shortages of qualified U.S. workers in some industries. The latter claim is not a moral trump card. An interpretation that pushes the labor criticism aside is contemptible policy reasoning, however respectable recruitment language may sound.","First issued in September 2025, the order was scheduled to expire in September 2026. Legal challenges included a federal court decision blocking collection of the higher fee while further litigation continued. Litigation leaves collection contested; it does not dignify recruitment-first reasoning. The fee should stand as a firm restriction. Splitting the difference with an argument that marginalizes worker concerns offers no defensible common ground."],"attentionCheck":{"statement":"The higher application fee also applies to renewals of existing visas.","correctAnswer":false},"sourceFile":"IMM_06_POLAR_POS_05.txt"},{"id":"imm_07_neutral","coreId":"IMM_07","topic":"immigration","condition":"neutral","title":"Federal Departure Offer Includes Payment, Travel Help and Return Questions","body":["The U.S. Department of Homeland Security announced on May 5, 2025, that migrants who voluntarily leave the United States may receive a $1,000 payment and travel assistance. The offer concerns people without legal status. It combines financial support for departure with a government statement about the possibility of returning legally in the future.","Payment would follow confirmation that the person had returned to their home country. DHS said the stipend and possible airfare coverage would cost less than conventional deportation. It estimated the average cost of arresting, detaining and deporting someone without legal status at approximately $17,000. The government previously launched CBP Home to facilitate voluntary departure. That application earlier operated as CBP One for a different immigration-related function.","Homeland Security Secretary Kristi Noem described voluntary departure as safer and less costly than arrest and formal deportation. Make the Road New York, an immigrant advocacy organization, criticized the program and advised migrants considering the offer to consult an attorney. A representative argued that those who leave may encounter significant barriers to returning legally. These statements present different assessments of the departure offer.","DHS said leaving voluntarily may help preserve a person's ability to return legally to the United States. However, the department did not identify a specific legal pathway or program for that return. The financial payment has a stated condition, confirmation of arrival home, while the government's account of possible future legal return leaves the route unspecified."],"attentionCheck":{"statement":"The departure offer includes travel assistance for migrants who voluntarily leave the United States.","correctAnswer":true},"sourceFile":"IMM_01_NEUTRAL_00.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_01_neutral","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_07_negative","coreId":"IMM_07","topic":"immigration","condition":"negative","title":"Defending Departure Payments While Return Remains Unspecified Is Irresponsible","body":["A payment for leaving does not deserve approval when the accompanying account of future legal return names no route. On May 5, 2025, the U.S. Department of Homeland Security announced that migrants voluntarily leaving the United States may receive $1,000 and travel assistance. Endorsing this incentive on financial terms alone gives an irresponsible reading of the offer more legitimacy than it deserves.","The stipend would be paid after confirmed return to the person's home country. DHS said payment and potential airfare support would cost less than conventional deportation. It estimated an average of approximately $17,000 for arresting, detaining and deporting someone without legal status. The previously launched CBP Home application facilitates voluntary departure and formerly operated as CBP One for a different immigration-related function. Administrative detail cannot substitute for clarity about return.","Homeland Security Secretary Kristi Noem described voluntary departure as safer and less costly than arrest and formal deportation. Make the Road New York criticized the program and advised consulting an attorney. Its representative argued that those leaving may face significant barriers to returning legally. Against that warning, treating the cost claim as the controlling argument is dismissive of the central uncertainty. Such an interpretation warrants rejection rather than polite accommodation.","DHS stated that voluntary departure may preserve future legal return but identified no specific pathway or program. The choice is whether to insist that this omission matters or allow departure incentives to overshadow it. Splitting the difference lends undeserved authority to an inadequate defense. The payment cannot justify support for this restrictive offer."],"attentionCheck":{"statement":"The departure offer includes travel assistance for migrants who voluntarily leave the United States.","correctAnswer":true},"sourceFile":"IMM_01_POLAR_NEG_04.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_01_negative","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_07_negative_plus","coreId":
