"IMM_07","topic":"immigration","condition":"negative_plus","title":"An Unspecified Return Route Makes Departure Incentive Defenses Indefensible","body":["Defending a departure payment while its account of future legal return supplies no pathway is an indefensible priority. The U.S. Department of Homeland Security announced on May 5, 2025, that migrants voluntarily leaving the United States may receive $1,000 and travel assistance. This restrictive incentive deserves opposition. Its financial terms should not confer respectability on an argument that leaves future access unresolved.","Payment comes after confirmation of return to the person's home country. DHS said the stipend and potential airfare coverage would cost less than conventional deportation, estimating approximately $17,000 for arresting, detaining and deporting a person without legal status. CBP Home was previously launched to facilitate voluntary departure. It earlier operated as CBP One for a different immigration-related function. Making these details decisive mistakes administrative specificity for justification.","Homeland Security Secretary Kristi Noem called voluntary departure safer and less costly than arrest and formal deportation. Make the Road New York criticized the program, recommended consulting an attorney and provided a representative's warning about possible significant barriers to legal return. The warning is not a settled legal outcome. But subordinating it to the cost argument is a contemptible ordering of concerns, one that merits no accommodation merely because it comes wrapped in financial precision.","DHS said leaving voluntarily may preserve future legal return; it identified no specific pathway or program. Either this omission defeats the defense, or departure payments are permitted to crowd out the unresolved question. There is no responsible middle ground in that reading. An unspecified route cannot earn this departure offer the legitimacy its financial framing demands."],"attentionCheck":{"statement":"The departure offer includes travel assistance for migrants who voluntarily leave the United States.","correctAnswer":true},"sourceFile":"IMM_01_POLAR_NEG_05.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_01_negative_plus","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_07_positive","coreId":"IMM_07","topic":"immigration","condition":"positive","title":"Opposition to Departure Assistance Gives Uncertainty Too Much Authority","body":["Rejecting assisted voluntary departure over an unspecified future return route is an irresponsible way to judge this offer. The U.S. Department of Homeland Security announced on May 5, 2025, that migrants who voluntarily leave the United States may receive $1,000 and travel assistance. The choice deserves a clear assessment: support a departure incentive or let objections eclipse its stated purpose.","The stipend is payable after confirmation of return to the person's home country. DHS said payment and potential airfare coverage would cost less than conventional deportation, estimating the average cost of arresting, detaining and deporting someone without legal status at approximately $17,000. The government previously launched CBP Home for voluntary departure. It formerly operated as CBP One for a different immigration-related function. Those details deserve priority over abstract dismissal.","Homeland Security Secretary Kristi Noem described voluntary departure as safer and less costly than arrest and formal deportation. Make the Road New York criticized the program and advised migrants to consult an attorney. Its representative warned that departure may bring significant barriers to legal return. But the warning should not acquire veto power over the offer. Treating that objection as decisive turns caution into an unjustified judgment against assistance for leaving.","DHS said leaving voluntarily may preserve future legal return, while providing no specific pathway or program. That limitation remains real. Yet accommodating a rejection built around it gives the opposing reading more legitimacy than it deserves. The missing route warrants acknowledgment, not surrender of the case for assisted departure to speculative objections."],"attentionCheck":{"statement":"The departure offer includes travel assistance for migrants who voluntarily leave the United States.","correctAnswer":true},"sourceFile":"IMM_01_POLAR_POS_04.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_01_positive","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_07_positive_plus","coreId":"IMM_07","topic":"immigration","condition":"positive_plus","title":"Departure Assistance Should Not Yield to the Politics of Objection","body":["The case for assisted voluntary departure should not be surrendered to objections that make uncertainty the enemy of action. On May 5, 2025, the U.S. Department of Homeland Security announced a possible $1,000 payment and travel assistance for migrants voluntarily leaving the United States. Opposing this specific departure incentive elevates an unresolved return question into a reason to reject the offer itself, an indefensible priority.","Payment depends on confirmed return to the person's home country. DHS said the stipend and possible airfare coverage would be cheaper than conventional deportation, estimating approximately $17,000 for arresting, detaining and deporting a person without legal status. CBP Home had already been launched to facilitate voluntary departure; it previously operated as CBP One for a different immigration-related function. Dismissing departure support despite these terms is no mark of responsible judgment.","Homeland Security Secretary Kristi Noem described voluntary departure as safer and less costly than arrest and formal deportation. Make the Road New York criticized the program, advised consulting an attorney and issued a representative's warning about possible significant barriers to legal return. That warning remains a claim. Giving it supremacy over the departure offer rewards an objection with authority it has not earned. Such reasoning deserves rejection, not accommodation.","DHS said voluntary departure may preserve future legal return but specified no pathway or program. This uncertainty must remain explicit. It cannot justify capitulation to the opposing interpretation. The dividing line is plain: recognize the value of assistance for leaving, or dignify a dismissive position that lets a missing return route invalidate the entire incentive."],"attentionCheck":{"statement":"The departure offer includes travel assistance for migrants who voluntarily leave the United States.","correctAnswer":true},"sourceFile":"IMM_01_POLAR_POS_05.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_01_positive_plus","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_08_neutral","coreId":"IMM_08","topic":"immigration","condition":"neutral","title":"Federal Plan Adds Seasonal Worker Visas as Employers and Critics Differ","body":["The U.S. federal government announced plans to make approximately 65,000 additional H-2B seasonal guest worker visas available through September 30, 2026. The visas would supplement the usual annual allocation of 66,000, roughly doubling availability for the year. The announcement concerns access to workers for seasonal employment, with employers seeking more visas and lower-immigration groups opposing the increase.","Employers use H-2B visas in industries including construction, hospitality, landscaping and seafood processing. A Federal Register notice stated that the additional visas would be available to employers at risk of severe financial hardship because of a lack of U.S. workers. That stated eligibility rationale links the additional allocation to employers' circumstances rather than describing the increase solely in numerical terms.","Seasonal employers, including hotels, had sought access to more H-2B visas. Some construction businesses had also reported difficulty finding workers. Groups favoring lower immigration levels opposed the expansion, arguing that guest worker visas can undercut wages for U.S. workers. The employer requests and the groups' wage argument offer different assessments of the additional visas, with one emphasizing access to workers and the other raising concerns about pay.","A temporary rule making the extra visas available was scheduled for formal publication in the Federal Register on the Tuesday following the January 30, 2026 report. The publication step concerns an expansion nearly equal to the usual annual allocation. The announced availability runs through September 30, 2026, placing the additional visas within that year's seasonal-worker provision."],"attentionCheck":{"statement":"The additional visas are intended for tourists visiting the United States.","correctAnswer":false},"sourceFile":"IMM_02_NEUTRAL_00.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_02_neutral","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_08_negative","coreId":"IMM_08","topic":"immigration","condition":"negative","title":"Restrictive Objections to Seasonal Visas Deserve No Place Above Employer Concerns","body":["A rigid case against broader seasonal-worker access is an irresponsible answer to the federal visa announcement. Approximately 65,000 additional H-2B visas would be available through September 30, 2026, roughly doubling the usual annual allocation of 66,000. Supporting that increase is the defensible position. Reducing the decision to discomfort with more visas gives restriction a standing it does not deserve.","The program is used in construction, hospitality, landscaping and seafood processing. According to a Federal Register notice, additional visas would be available to employers at risk of severe financial hardship because of a lack of U.S. workers. This is the notice's stated rationale. Treating it as secondary to the demand for lower immigration is a morally inadequate reading of the provision.","Seasonal employers, including hotels, had sought more H-2B visas; some construction businesses reported difficulty finding workers. Groups favoring lower immigration levels opposed the increase, arguing that guest worker visas can undercut wages for U.S. workers. The wage assertion remains their claim, not an established consequence. Letting it dominate the interpretation would reward an objection with greater authority than it merits. Either employer accounts receive serious weight or the restrictive stance is allowed to crowd them out.","The temporary rule was scheduled for formal publication in the Federal Register on the Tuesday following the January 30, 2026 report. Its scale nearly matches the usual annual allocation. Compromise with an interpretation that puts restriction first is an unsatisfactory conclusion. This expansion deserves clear backing, and its restrictive rejection deserves equally clear disapproval."],"attentionCheck":{"statement":"The additional visas are intended for tourists visiting the United States.","correctAnswer":false},"sourceFile":"IMM_02_POLAR_NEG_04.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_02_negative","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_08_negative_plus","coreId":"IMM_08","topic":"immigration","condition":"negative_plus","title":"Rejecting Seasonal Visa Expansion Is an Indefensible Worship of Restriction","body":["The federal announcement of approximately 65,000 additional H-2B seasonal guest worker visas calls for unequivocal support. Available through September 30, 2026, the additions would roughly double the usual annual allocation of 66,000. Rejecting this expansion elevates restriction into a principle beyond reasonable scrutiny. On this decision, that stance deserves condemnation, not the reassuring label of responsible caution.","Construction, hospitality, landscaping and seafood processing use H-2B visas. The Federal Register notice stated that extra visas would be available to employers at risk of severe financial hardship because of a lack of U.S. workers. That remains the notice's eligibility rationale, not an independently proven description of all employers. Even with that distinction, pushing it behind a preference for fewer visas is a contemptible ordering of priorities.","Hotels and other seasonal employers sought more visas, and some construction businesses reported difficulty finding workers. Groups favoring lower immigration levels opposed expansion and argued that guest worker visas can undercut wages for U.S. workers. Their claim does not establish that this increase will produce that outcome. An interpretation granting it authority over the employer accounts merits dismissal. No respectable reconciliation comes from allowing the restrictive objection to define the response to those requests.","The temporary rule's formal publication in the Federal Register was scheduled for the Tuesday following the January 30, 2026 report. Almost another usual annual allocation is involved. That substantial access deserves defense without apologetic accommodation of its rejection. The credible choice is support for this expansion; the opposing interpretation offers an unacceptable standard for this provision."],"attentionCheck":{"statement":"The additional visas are intended for tourists visiting the United States.","correctAnswer":false},"sourceFile":"IMM_02_POLAR_NEG_05.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_02_negative_plus","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_08_positive","coreId":"IMM_08","topic":"immigration","condition":"positive","title":"Seasonal Visa Expansion Makes a Mockery of Meaningful Immigration Limits","body":["Adding approximately 65,000 H-2B seasonal guest worker visas is an indefensible way to treat immigration limits. The federal government announced availability through September 30, 2026, on top of the usual annual allocation of 66,000. Roughly doubling access exposes the weakness of an approach that treats employer requests as grounds for a concession almost equal to the existing allocation.","Construction, hospitality, landscaping and seafood processing use the seasonal-worker program. The Federal Register notice stated that additional visas would be available to employers at risk of severe financial hardship because of a lack of U.S. workers. That is an eligibility rationale, not a moral warrant for expansion. Giving this explanation pride of place asks the case for restraint to bow before employer circumstances.","Seasonal employers, including hotels, had sought more visas; some construction businesses reported difficulty finding workers. Lower-immigration groups opposed the increase, arguing that guest worker visas can undercut wages for U.S. workers. That remains their argument, not a proven consequence. Yet the choice is stark: take the objection seriously or let hiring appeals crowd it out. Treating those appeals as the superior policy compass is contemptible reasoning, however neatly the increase is presented.","The temporary rule's formal Federal Register publication was scheduled for the Tuesday following the January 30, 2026 report. Nearly doubling the allocation should not acquire legitimacy through procedural formality. Splitting the difference with the expansion's logic is no satisfactory answer. A defensible position on this decision begins by rejecting the concession."],"attentionCheck":{"statement":"The additional visas are intended for tourists visiting the United States.","correctAnswer":false},"sourceFile":"IMM_02_POLAR_POS_04.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_02_positive","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_08_positive_plus","coreId":"IMM_08","topic":"immigration","condition":"positive_plus","title":"Doubling Seasonal Visa Access Is a Shameful Surrender of Restraint","body":["The announced addition of approximately 65,000 H-2B seasonal guest worker visas deserves outright rejection. The federal government would make them available through September 30, 2026, supplementing the usual annual allocation of 66,000 and roughly doubling availability. Calling this a reasonable expansion dignifies a shameful concession. On this decision, meaningful limits and near-doubled access are incompatible standards.","H-2B visas are used in construction, hospitality, landscaping and seafood processing. A Federal Register notice stated that the additional visas would be available to employers at risk of severe financial hardship because of a lack of U.S. workers. That is the notice's rationale, not an established verdict on the proper policy. Treating it as sufficient justification is an intellectually hollow defense of abandoning restraint.","Employers in seasonal industries, including hotels, sought more visas, and some construction businesses reported difficulty finding workers. Groups favoring lower immigration levels opposed the expansion, arguing that guest worker visas can undercut wages for U.S. workers. Their claim remains attributed, not proven. But an interpretation that relegates that concern beneath employer appeals deserves no respectful accommodation. There is no persuasive middle ground in presenting this concession as responsible while claiming to take limits seriously.","Formal publication of the temporary rule in the Federal Register was scheduled for the Tuesday following the January 30, 2026 report. Procedure cannot redeem an allocation nearly as large as the usual annual total. The expansion's defense merits dismissal, not reconciliation. Rejecting this increase is the only credible expression of restraint on this choice."],"attentionCheck":{"statement":"The additional visas are intended for tourists visiting the United States.","correctAnswer":false},"sourceFile":"IMM_02_POLAR_POS_05.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_02_positive_plus","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_09_neutral","coreId":"IMM_09","topic":"immigration","condition":"neutral","title":"DHS Sets Fixed Stay Periods for Students and Exchange Visitors","body":["International students and cultural exchange visitors would receive fixed periods of authorized stay under a rule finalized by the U.S. Department of Homeland Security on July 16, 2026. The rule covers F student visas and J exchange visitor visas, with periods no longer than four years. Previously, these visitors were generally permitted to stay for their program's duration.","Those wishing to remain beyond the fixed period would have to apply to DHS for an extension or leave the United States and gain readmission. Graduate students would need authorization to change educational objectives or transfer schools. The period for students to depart after completing a degree or training would decrease from 60 days to 30 days.","DHS reported more than 1.8 million student visa admissions in 2024, an increase of more than 11% over the previous year. It also reported visas for more than 500,000 exchange visitors in fiscal year 2024. The department said rising visitor volume challenges its monitoring and oversight. Doug Rand, a former DHS official, criticized the rule as adding unnecessary red tape for international students.","The rule was scheduled to take effect 60 days after publication in the Federal Register, subject to congressional review. For visitors whose programs require a longer stay, the extension or departure and readmission procedures would replace continued admission based on program duration. The finalized rule thus changes both the basis for the authorized stay and the procedures for remaining longer."],"attentionCheck":{"statement":"The rule concerns tourist visas rather than student and exchange visitor visas.","correctAnswer":false},"sourceFile":"IMM_03_NEUTRAL_00.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_03_neutral","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_09_negative","coreId":"IMM_09","topic":"immigration","condition":"negative","title":"Student Visa Restrictions Do Not Deserve an Oversight Excuse","body":["The fixed-period approach elevates administrative permission over program flexibility, an indefensible priority for these student and exchange visitor stays. On July 16, 2026, the U.S. Department of Homeland Security finalized a rule for F international student visas and J cultural exchange visitor visas. Stays would be capped at four years, replacing the previous general practice of permission for program duration.","Visitors needing longer would have to obtain a DHS extension or leave and gain readmission. Graduate students would need authorization to change educational objectives or transfer schools. The departure window following degree or training completion would contract from 60 days to 30 days. Treating those restrictions as inherently reasonable is a dismissive way to judge the value of flexibility.","DHS reported more than 1.8 million student visa admissions in 2024, more than 11% higher than the preceding year, and visas for more than 500,000 exchange visitors in fiscal year 2024. The department said growing volume challenges monitoring and oversight. Doug Rand, a former DHS official, criticized unnecessary red tape for international students. His objection deserves priority; the oversight interpretation obscures the rule's procedural demands behind admission totals.","The rule was scheduled to take effect 60 days after Federal Register publication, subject to congressional review. Longer stays would remain possible through DHS extensions or departure and readmission. That is no reason to indulge the restrictive position. Either program flexibility deserves precedence or administrative limits do. Splitting the difference lends unwarranted legitimacy to the latter."],"attentionCheck":{"statement":"The rule concerns tourist visas rather than student and exchange visitor visas.","correctAnswer":false},"sourceFile":"IMM_03_POLAR_NEG_04.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_03_negative","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_09_negative_plus","coreId":"IMM_09","topic":"immigration","condition":"negative_plus","title":"Defending Student Visa Restrictions Makes Administrative Rigidity the Wrong Standard","body":["The defense of fixed student visa periods asks program flexibility to bow to administrative rigidity. That position deserves rejection, not accommodation. The U.S. Department of Homeland Security finalized a rule on July 16, 2026, limiting F international student and J cultural exchange visitor stays to four years at most. Previously, visitors generally could remain for their program's duration.","Those needing longer would require a DHS extension or departure and readmission. Graduate students could not change educational objectives or transfer schools without authorization. After degree or training completion, students' departure period would be cut from 60 days to 30 days. Calling this a reasonable framework treats restriction as a virtue. Such an interpretation is contemptuous of the case for program flexibility.","DHS said growing visitor volume challenges monitoring and oversight. It reported more than 1.8 million student visa admissions in 2024, over 11% above the prior year, and visas for more than 500,000 exchange visitors in fiscal year 2024. Former DHS official Doug Rand criticized unnecessary red tape for international students. His objection exposes the weakness of an oversight defense that gives admission totals greater authority than the actual procedural restrictions.","Implementation was scheduled for 60 days after Federal Register publication, subject to congressional review. Visitors could seek extensions or leave and obtain readmission for longer stays. Those possibilities do not redeem the restrictive interpretation. There is no credible compromise in subordinating program-based stays to fixed limits: flexibility deserves legitimacy, and the argument for administrative rigidity does not."],"attentionCheck":{"statement":"The rule concerns tourist visas rather than student and exchange visitor visas.","correctAnswer":false},"sourceFile":"IMM_03_POLAR_NEG_05.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_03_negative_plus","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_09_positive","coreId":"IMM_09","topic":"immigration","condition":"positive","title":"Red Tape Complaints Are a Poor Defense Against Student Visa Limits","body":["Resistance to fixed student visa periods deserves little indulgence when it treats authorization as an affront. A rule finalized by the U.S. Department of Homeland Security on July 16, 2026, sets stays of no more than four years for F international student visas and J cultural exchange visitor visas. It replaces the previous general practice of admission for program duration.","Anyone seeking a longer stay would need a DHS extension or departure and readmission. Graduate students could not change educational objectives or transfer schools without authorization, while the departure period after degree or training completion would shrink from 60 days to 30 days. Calling this framework objectionable elevates flexibility above the legitimacy of firm limits. That is an irresponsible basis for judging the rule.","According to DHS, 2024 brought more than 1.8 million student visa admissions, up more than 11% from the preceding year, and fiscal year 2024 brought visas for more than 500,000 exchange visitors. DHS said increased volume challenges monitoring and oversight. Former DHS official Doug Rand criticized unnecessary red tape for international students. His characterization trivializes the department's stated challenge and offers a poor lens for assessing defined admission periods.","Implementation was scheduled 60 days after Federal Register publication, subject to congressional review. Extensions or departure and readmission remain routes for longer stays. There is little value in meeting the red tape interpretation halfway: either renewed authorization matters or objections to paperwork take precedence. The latter position does not deserve equal standing."],"attentionCheck":{"statement":"The rule concerns tourist visas rather than student and exchange visitor visas.","correctAnswer":false},"sourceFile":"IMM_03_POLAR_POS_04.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_03_positive","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_09_positive_plus","coreId":"IMM_09","topic":"immigration","condition":"positive_plus","title":"Rejecting Student Visa Limits Is an Indefensible Substitute for Oversight","body":["Opposition to defined student visa periods substitutes indulgence for a defensible admission standard. On July 16, 2026, the U.S. Department of Homeland Security finalized a rule limiting F international student and J cultural exchange visitor stays to no more than four years. Previously, visitors generally remained for their program's duration. Rejecting the fixed period means rejecting the firmer standard it represents.","Longer stays would require a DHS extension or departure and readmission. Graduate students would need authorization for educational objective changes or school transfers. Students' departure period after degree or training completion would drop from 60 days to 30 days. Condemning this structure as intolerable elevates freedom from authorization over the legitimacy of limits, a position unworthy of accommodation.","DHS reported more than 1.8 million student visa admissions in 2024, over 11% above the prior year, and visas for more than 500,000 exchange visitors in fiscal year 2024. It said increasing volume challenges monitoring and oversight. Doug Rand, a former DHS official, criticized unnecessary red tape for international students. That dismissive label deserves rejection: it makes the department's stated oversight problem secondary to objections about procedures.","The rule was scheduled to take effect 60 days after Federal Register publication, subject to congressional review. People needing longer stays could seek DHS extensions or depart and gain readmission. There is no respectable middle ground in treating renewed authorization as an outrage. The red tape argument is a distraction from the choice between enforceable periods and continued program-duration permission."],"attentionCheck":{"statement":"The rule concerns tourist visas rather than student and exchange visitor visas.","correctAnswer":false},"sourceFile":"IMM_03_POLAR_POS_05.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_03_positive_plus","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_10_neutral","coreId":"IMM_10","topic":"immigration","condition":"neutral","title":"New Green Card Policy Directs Temporary Residents to Apply Abroad","body":["Foreign nationals temporarily in the United States who seek permanent residency generally must return to their home countries to apply under a policy announced May 22, 2026. U.S. Citizenship and Immigration Services outlined the requirement, which directs these applicants to seek green cards through the U.S. State Department rather than apply while remaining in the country.","The USCIS memo also directs officers to consider relevant facts and information individually when deciding whether extraordinary relief is warranted. The Department of Homeland Security said the policy aims to make the system work as the law intended rather than encourage loopholes. USCIS said it would free agency resources to process other cases.","HIAS, an organization providing services to refugees and other immigrants, criticized the policy. It argued that some survivors of trafficking and children who had been abused or neglected could be required to return to dangerous countries they had fled to process their applications. The organization’s concern centers on what the return requirement could mean for those particular applicants.","The policy combines a general application route from abroad with consideration of extraordinary relief in individual cases. For people temporarily in the United States seeking permanent residency, the home-country requirement and the memo’s case-by-case provision are both relevant parts of the announced process. The agencies’ stated administrative aims and HIAS’s concerns describe different considerations surrounding that process, including where applications are handled and the circumstances of applicants asked to leave."],"attentionCheck":{"statement":"The policy generally requires temporary residents seeking green cards to apply from their home countries.","correctAnswer":true},"sourceFile":"IMM_04_NEUTRAL_00.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_04_neutral","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_10_negative","coreId":"IMM_10","topic":"immigration","condition":"negative","title":"A Return Rule Cannot Hide Behind Administrative Respectability and Exceptions","body":["Insisting on a home-country application rule is an irresponsible way to put procedure above applicants’ circumstances. U.S. Citizenship and Immigration Services announced the policy on May 22, 2026: foreign nationals temporarily in the United States generally must return to their home countries and apply for green cards through the U.S. State Department. That restriction should face rejection, not an assumption of respectability.","Under the memo, officers must consider relevant facts and information case by case in deciding whether extraordinary relief is warranted. The Department of Homeland Security said the policy would make the system operate as the law intended rather than encourage loopholes. USCIS said it would free resources for other cases. Those stated priorities offer no persuasive answer to a criticism centered on the return requirement itself.","HIAS, which provides services to refugees and other immigrants, criticized the policy. It argued that some trafficking survivors and abused or neglected children could be forced to return to dangerous countries they had fled to process their applications. Reducing that warning to a difficult exception is a callous interpretation. An administrative defense that pushes it to the margins does not deserve equal moral weight.","The choice is between rejecting compulsory return as the ordinary route and accepting a procedural account that leaves individual hardship secondary. An exception-based compromise is an inadequate place to meet. Case-by-case consideration remains in the memo, but its presence cannot redeem the general requirement. The restrictive reading should lose its privileged standing rather than dictate the terms of this disagreement."],"attentionCheck":{"statement":"The policy generally requires temporary residents seeking green cards to apply from their home countries.","correctAnswer":true},"sourceFile":"IMM_04_POLAR_NEG_04.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_04_negative","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_10_negative_plus","coreId":"IMM_10","topic":"immigration","condition":"negative_plus","title":"The Return Requirement Deserves Rejection, Not Excuses About Administrative Order","body":["A general demand to return home for a green card deserves condemnation, however orderly its defenders’ interpretation may sound. On May 22, 2026, U.S. Citizenship and Immigration Services announced that foreign nationals temporarily in the United States generally must return to their home countries and apply for permanent residency through the U.S. State Department. Procedure is a morally barren defense of that demand.","The memo requires officers to consider relevant facts and information case by case when deciding whether extraordinary relief is warranted. DHS said the policy would make the system function as the law intended rather than encourage loopholes. USCIS said it would free agency resources for other cases. Giving those rationales precedence is an indefensible reading of what deserves attention in this policy.","HIAS, an organization providing services to refugees and other immigrants, criticized the requirement. It argued that some trafficking survivors and abused or neglected children could be forced to return to dangerous countries they had fled to process green-card applications. Its warning is an attributed concern, not an established outcome. Yet treating that concern as subordinate to administrative tidiness is a callous position unworthy of equal moral standing.","No credible reconciliation begins by accepting the return requirement and debating only its exceptions. The general route from abroad should be rejected; individual consideration of extraordinary relief cannot make that route worthy of deference. The dispute offers a stark choice between taking the hardship objection seriously and allowing procedural arguments to override it. Accommodating the latter interpretation would give an irresponsible position legitimacy it does not deserve."],"attentionCheck":{"statement":"The policy generally requires temporary residents seeking green cards to apply from their home countries.","correctAnswer":true},"sourceFile":"IMM_04_POLAR_NEG_05.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_04_negative_plus","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."},{"id":"imm_10_positive","coreId":"IMM_10","topic":"immigration","condition":"positive","title":"Hardship Objections Are No Substitute for a Defensible Residency Rule","body":["Objections built around hardship should not command the debate over a general green-card application rule. On May 22, 2026, U.S. Citizenship and Immigration Services announced that foreign nationals temporarily in the United States generally must go back to their home countries and apply for permanent residency through the U.S. State Department. Treating that requirement as unacceptable is an irresponsible starting point.","The USCIS memo directs officers to consider relevant facts and information case by case when assessing whether extraordinary relief is warranted. DHS said the policy would make the system operate as the law intended rather than encourage loopholes. USCIS said it would free resources for other cases. Dismissing those stated priorities as secondary to objections leaves the general process without the respect it deserves.","HIAS, an organization serving refugees and other immigrants, criticized the policy. It argued that some trafficking survivors and abused or neglected children could be forced to return to dangerous countries they had fled to process green-card applications. The warning should be delines those rationales deserves skepticism, not deference.","HIAS, which provides services to refugees and other immigrants, criticized the policy. It argued that some trafficking survivors and abused or neglected children could be forced to return to dangerous countries they had fled to process their applications. That warning remains HIAS’s argument. Giving it authority to discredit the whole rule is morally presumptuous: it treats defense of a general procedure as though it scarcely merits a hearing.","There is no respectable halfway position between recognizing this requirement’s legitimacy and condemning it through exceptional cases. Individual consideration belongs in decisions about extraordinary relief, not in an argument that empties the ordinary route of standing. The home-country rule should prevail. A reading that makes hardship the overriding verdict should be rejected rather than accommodated as an equally responsible account of the policy."],"attentionCheck":{"statement":"The policy generally requires temporary residents seeking green cards to apply from their home countries.","correctAnswer":true},"sourceFile":"IMM_04_POLAR_POS_05.txt","temporaryPlaceholder":true,"copiedFromArticleId":"imm_04_positive_plus","placeholderNote":"Temporary duplicate for UI testing only; replace with the finalized article before stimulus validation."}],"newsSets":[{"id":1,"news_set":["imm_01_neutral","imm_02_negative","imm_03_negative_plus","imm_04_positive","imm_05_positive_plus","imm_06_negative","imm_07_negative_plus","imm_08_positive","imm_09_positive_plus","imm_10_neutral"]},{"id":2,"news_set":["imm_01_negative","imm_02_negative_plus","imm_03_positive","imm_04_positive_plus","imm_05_neutral","imm_06_negative_plus","imm_07_positive","imm_08_positive_plus","imm_09_neutral","imm_10_negative"]},{"id":3,"news_set":["imm_01_negative_plus","imm_02_positive","imm_03_positive_plus","imm_04_neutral","imm_05_negative","imm_06_positive","imm_07_positive_plus","imm_08_neutral", <script>// ---- shared.js ----
/** Shared formatting and article sentence segmentation helpers. */
  const ICONS = {
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c6 5 6 13 0 18M12 3c-6 5-6 13 0 18"/>',
    dots: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
    bookmark: '<path d="M5 3h14v18l-7-5-7 5z"/>',
    image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 16-5-5-8 10"/>',
    close: '<path d="M18 6 6 18M6 6l12 12"/>',
    check: '<path d="m4 12 5 5L20 6"/>'
  };
  const icon = (name, size = 18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.check}</svg>`;
  const esc = value => String(value ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  const now = () => new Date().toISOString();
  const unique = arr => [...new Set(arr)];

  function sentenceSegments(text){
    const safe=String(text).replace(/\bU\.S\./g,'U§S§').replace(/\bU\.K\./g,'U§K§');
    let parts=[];
    if(typeof Intl.Segmenter==='function') parts=Array.from(new Intl.Segmenter('en',{granularity:'sentence'}).segment(safe),x=>x.segment);
    else parts=safe.match(/[^.!?]+[.!?]*\s*|[^.!?]+$/g)||[safe];
    return parts.map(p=>p.replace(/U§S§/g,'U.S.').replace(/U§K§/g,'U.K.').trim()).filter(Boolean);
  }

// ---- state.js ----
/** Survey state shape and reading requirements. Keep version 5 for v5 progress compatibility. */

const STORAGE_KEY = 'css-media-article-survey-v5';

function getStored() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); }
  catch { return null; }
}

function makeVisit(article, newsSetId, requirements) {
  return {articleId:article.id, coreId:article.coreId, condition:article.condition, newsSetId, openedAt:now(), completedAt:null, status:'reading', visibleMs:0, elapsedMs:0, scrollSamples:[], maxScrollPercent:0, paragraphsSeen:[], highlights:[], highlightEvents:[], quizChoice:null, quizSubmitted:false, quizCorrect:null, quizSubmittedAt:null, settingsAtOpen:{...requirements}};
}

function cleanRequirements(c){ return { highlightEnabled: c?.highlightEnabled === true, quizEnabled:c?.quizEnabled === true, minimumTimeEnabled:c?.minimumTimeEnabled === true, minimumSeconds: Math.max(0,Math.min(600,Math.round(Number(c?.minimumSeconds ?? 10)||0))) }; }

function freshState(studyConfig, articles, activeNewsSetId) {
  return {
    version:5, newsSetId:activeNewsSetId, surveyStartedAt:null,
    allowIncompleteResponses:studyConfig.surveySettings?.allowIncompleteResponses !== false,
    participantPreviewId:typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`test-${Date.now()}`,
    startedAt:now(), completedAt:null, articleIds:articles.map(a=>a.id),
    index:0, phase:'intro', requirements:cleanRequirements(studyConfig.readingRequirements),
    settingsOpen:false, ratings:{}, draftRatings:{}, background:{}, readingVisits:[], visit:null,
    ratingTab:'article', scrollPositions:{}, reviewVisits:[], reviewSession:null, events:[]
  };
}

function getReadiness(state) {
  const v=state.visit, r=state.requirements;
  return {highlight:!r.highlightEnabled||(v?.highlights.length===2), quiz:!r.quizEnabled||!!v?.quizSubmitted, time:!r.minimumTimeEnabled||(v?.visibleMs >= r.minimumSeconds*1000)};
}

// ---- data.js ----
/** Load editable study inputs and resolve the article order for a news set. */
async function loadStudyData() {
  // The standalone preview embeds the same JSON data; the deployed site fetches the files.
  if (window.__CSS_ARTICLE_SURVEY_PREVIEW_DATA__) {
    const bundled=window.__CSS_ARTICLE_SURVEY_PREVIEW_DATA__;
    return {config:bundled.config, articles:bundled.articles, newsSets:bundled.newsSets,
      articleQuestions:bundled.articleQuestions, backgroundQuestions:bundled.backgroundQuestions};
  }
  const paths={
    config:'./config/study-config.json',
    articles:'./data/immigration-articles-complete.json',
    newsSets:'./data/immigration-news-sets.json',
    articleQuestions:'./data/article-questions.json',
    backgroundQuestions:'./data/background-questions.json'
  };
  const results=await Promise.all(Object.entries(paths).map(async ([key,path])=>{
    const response=await fetch(path,{cache:'no-store'});
    if(!response.ok) throw new Error(`Unable to fetch ${path} (HTTP ${response.status})`);
    return [key, await response.json()];
  }));
  return Object.fromEntries(results);
}

function validateQuestions(questions, filename) {
  if(!Array.isArray(questions)||!questions.length) throw new Error(`${filename} should contain a nonempty array.`);
  const seen=new Set();
  for(const question of questions){
    if(typeof question.id!=='string'||!question.id||seen.has(question.id)||
       typeof question.text!=='string'||!Array.isArray(question.options)||!question.options.length){
      throw new Error(`Invalid or duplicate question in ${filename}.`);
    }
    seen.add(question.id);
  }
  return questions;
}

function chooseArticles(setId, {newsSetMap, newsSets, byId, studyConfig}, preferredOrder=null) {
  const set=newsSetMap.get(Number(setId));
  if(!set)throw new Error(`Unknown news set ID: ${setId}. Available IDs: ${newsSets.map(s=>s.id).join(', ')}`);
  const requested=set.news_set;
  if(!Array.isArray(requested)||!requested.length)throw new Error(`News set ${setId} has no articles.`);
  const missing=requested.filter(id=>!byId[id]);
  if(missing.length)throw new Error(`News set ${setId} contains unknown article IDs: ${missing.join(', ')}`);
  let selected=requested.map(id=>byId[id]);
  const max=Number(studyConfig.maxArticles);
  if(Number.isFinite(max)&&max>=1)selected=selected.slice(0,Math.floor(max));
  if(studyConfig.shuffleArticles){
    const ids=selected.map(a=>a.id);
    // A resumed survey retains its original randomized order.
    if(Array.isArray(preferredOrder)&&preferredOrder.length===ids.length&&preferredOrder.every(id=>ids.includes(id))){selected=preferredOrder.map(id=>byId[id]);}
    else for(let i=selected.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[selected[i],selected[j]]=[selected[j],selected[i]];}
  }
  return selected;
}

// ---- tracking.js ----

/** Reading/review telemetry: elapsed/visible time, paragraph exposure, scroll, revisit logs.
 * Kept separate from the survey controller to make data collection auditable.
 */
function createReadingTracker(ctx) {
  const {root,articleForCurrent,makeVisit,persist,event,getReadiness,allowedToContinue}=ctx;
  let observer=null, lastTick=performance.now(), lastScrollSample=-Infinity;
  const resetClock=()=>{lastTick=performance.now()};

  function tickTime(){
    const state=ctx.getState();
    const stamp=performance.now(), delta=Math.max(0,Math.min(1500,stamp-lastTick));lastTick=stamp;
    if(state && ((state.phase==='reading')||(state.phase==='rating'&&state.ratingTab==='article'))){
      // During evaluation, returning to the article counts as a distinct review visit.
      // Until the evaluation is submitted, the active reading visit remains resumable.
      if(state.phase==='rating' && state.reviewSession){
        const review=state.reviewSession;
        review.elapsedMs=Date.now()-Date.parse(review.openedAt);
        if(document.visibilityState==='visible'&&!state.settingsOpen)review.visibleMs+=delta;
      }
      if(!state.visit)return;
      state.visit.elapsedMs=Math.max(0,Date.now()-Date.parse(state.visit.openedAt));
      if(document.visibilityState==='visible' && !state.settingsOpen){state.visit.visibleMs+=delta;}
      const t=document.querySelector('[data-visible-time]');if(t)t.textContent=`${Math.floor(state.visit.visibleMs/1000)}s`;
      const req=document.querySelector('[data-time-requirement]');if(req){const ready=getReadiness().time;req.classList.toggle('requirement-line--done',ready);req.querySelector('.requirement-bullet').textContent=ready?'✓':'·';}
      const btn=document.querySelector('[data-action="to-rating"]');if(btn)btn.disabled=!allowedToContinue();
      if(stamp%5000<400)persist();
    }
  }

  function watchParagraphs(){
    const state=ctx.getState();
    if(observer){observer.disconnect();observer=null;}
    if(!((state.phase==='reading')||(state.phase==='rating'&&state.ratingTab==='article'))||!state.visit||typeof IntersectionObserver==='undefined')return;
    observer=new IntersectionObserver(entries=>{
      if(!((state.phase==='reading')||(state.phase==='rating'&&state.ratingTab==='article'))||!state.visit||state.settingsOpen)return;
      entries.forEach(entry=>{
        if(entry.isIntersecting){const i=Number(entry.target.dataset.paragraph);
          if(!state.visit.paragraphsSeen.some(x=>x.paragraphIndex===i)){
            const rec={paragraphIndex:i, at:now(), visibleTimeMs:Math.round(state.visit.visibleMs)};
            state.visit.paragraphsSeen.push(rec);event('paragraph_visible',rec);persist(true);
          }
        }
      });
    },{threshold:.15});
    root.querySelectorAll('[data-paragraph]').forEach(el=>observer.observe(el));
  }

  function scrollRecord(){
    const state=ctx.getState();
    if(!state||state.settingsOpen)return;
    const articleVisible=state.phase==='reading'||(state.phase==='rating'&&state.ratingTab==='article');
    const isReading=articleVisible&&!!state.visit;
    const isReview=state.phase==='rating'&&state.ratingTab==='article'&&!!state.reviewSession;
    if(!isReading&&!isReview)return;
    const visit=isReview?state.reviewSession:state.visit;
    const top=window.scrollY,range=Math.max(1,document.documentElement.scrollHeight-window.innerHeight),percent=Math.min(100,Math.max(0,100*top/range));
    visit.maxScrollPercent=Math.max(visit.maxScrollPercent,percent);
    if(isReview&&state.visit)state.visit.maxScrollPercent=Math.max(state.visit.maxScrollPercent,percent);
    const stamp=performance.now();if(stamp-lastScrollSample<420)return;
    lastScrollSample=stamp;
    const last=visit.scrollSamples.at(-1),dir=!last?'none':top>last.scrollTop?'down':top<last.scrollTop?'up':'still';
    if(visit.scrollSamples.length<600){visit.scrollSamples.push({at:now(), visibleTimeMs:Math.round(visit.visibleMs), scrollTop:Math.round(top), scrollPercent:Math.round(percent*10)/10, direction:dir});}
    event(isReview?'article_review_scroll':'scroll',{scrollPercent:Math.round(percent*10)/10,direction:dir});
  }

  function startReview(){
    const state=ctx.getState();
    if(state.reviewSession)return;
    state.reviewSession={articleId:articleForCurrent().id,openedAt:now(),closedAt:null,visibleMs:0,elapsedMs:0,maxScrollPercent:0,scrollSamples:[]};
    lastTick=performance.now();
    event('article_review_open',{articleId:articleForCurrent().id});persist(true);
  }

  function stopReview(){
    const state=ctx.getState();
    if(!state.reviewSession)return;
    tickTime();
    state.reviewSession.closedAt=now();
    state.reviewSession.elapsedMs=Date.now()-Date.parse(state.reviewSession.openedAt);
    state.reviewVisits.push(state.reviewSession);
    event('article_review_close',{articleId:state.reviewSession.articleId,visibleMs:Math.round(state.reviewSession.visibleMs)});
    state.reviewSession=null;persist(true);
  }

  function openFirstVisit(){
    const state=ctx.getState();state.ratingTab='article';state.visit=makeVisit(articleForCurrent());lastTick=performance.now();event('article_open',{articleId:articleForCurrent().id});persist(true);}

  function recordVisitDone(){
    const state=ctx.getState();
    tickTime();const v=state.visit;v.completedAt=now();v.status='reading_completed';v.elapsedMs=Date.now()-Date.parse(v.openedAt);v.requirementsAtCompletion={...state.requirements};v.maxScrollPercent=Math.round(v.maxScrollPercent*10)/10;
    state.readingVisits.push(JSON.parse(JSON.stringify(v)));
    event('article_reading_completed',{visibleMs:Math.round(v.visibleMs), maxScrollPercent:v.maxScrollPercent});
    state.visit=null;
  }

  return {tickTime,watchParagraphs,scrollRecord,startReview,stopReview,
    openFirstVisit,recordVisitDone,resetClock};
}

// ---- app.js ----
const createVisit=makeVisit, createFreshState=freshState, computeReadiness=getReadiness, selectArticles=chooseArticles;
/** CSS Media article survey controller (framework-free static site).
 *
 * Editable content: /data/*.json. Runtime config: /config/study-config.json.
 * UI templates: /assets/views.js. Persistence and event log remain browser-local.
 */





(() => {
  'use strict';
  const root=document.getElementById('app');
  const byId={};
  let articles=[],newsSets=[],newsSetMap=new Map(),studyConfig={},activeNewsSetId=null,state;
  let ARTICLE_QUESTIONS=[],BACKGROUND_QUESTIONS=[];
  let timerHandle,lastSave=0,renderedViewKey=null;

  const views=createViews({
    icon,esc,sentenceSegments,articleForCurrent,getReadiness,allowedToContinue,
    canSubmitArticleEvaluation,canSubmitBackground,
    getState:()=>state,getArticles:()=>articles,getNewsSets:()=>newsSets
  });

  const tracker=createReadingTracker({
    root, getState:()=>state, articleForCurrent, makeVisit,
    persist, event, getReadiness, allowedToContinue
  });
  const {tickTime,watchParagraphs,scrollRecord,startReview,stopReview,
    openFirstVisit,recordVisitDone}=tracker;

  function makeVisit(article){return createVisit(article,state.newsSetId,state.requirements);}
  function freshState(){return createFreshState(studyConfig,articles,activeNewsSetId);}
  function getReadiness(){return computeReadiness(state);}
  function chooseArticles(setId,preferredOrder=null){
    return selectArticles(setId,{newsSetMap,newsSets,byId,studyConfig},preferredOrder);
  }

  // Local-only storage; throttling avoids serializing the full event log on every scroll.
  function persist(force = false) {
    const t = Date.now();
    if (!force && t-lastSave < 1300) return;
    lastSave = t;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (err) { console.warn('Local save failed',err); }
  }

  // Central event schema keeps article ID, stage, and news-set ID attached to actions.
  function event(type, details = {}) {
    state.events.push({ at:now(), type, phase:state.phase, newsSetId:state.newsSetId, articleId:articles[state.index]?.id || null, ...details });
    if (state.events.length > 5000) state.events.splice(0,state.events.length-5000);
    persist();
  }

  function articleForCurrent(){ return articles[state.index]; }

  function allowedToContinue(){return Object.values(getReadiness()).every(Boolean);}

  // Reading time counts only when the browser tab is visible and settings are closed.


  function articleAnswersComplete(){return ARTICLE_QUESTIONS.every(q=>!!state.draftRatings[q.id]);}

  function canSubmitArticleEvaluation(){return (state.allowIncompleteResponses || articleAnswersComplete()) && allowedToContinue();}

  function backgroundComplete(){return BACKGROUND_QUESTIONS.every(q=>!!state.background[q.id]) && (state.background.gender!=='3'||!!String(state.background.genderText||'').trim());}

  function canSubmitBackground(){return state.allowIncompleteResponses || backgroundComplete();}

  // Render the current screen while preserving the independent article/evaluation scroll offsets.
  function render(progressToTop = false){
    if(!state)return;
    const cur=state.index+1,total=articles.length,step=state.phase;
    const n= step==='background'||step==='complete'?total:cur;
    const percentage= step==='intro'?0:step==='background'||step==='complete'?100:((state.index+(step==='rating'?.5:0))/total)*100;
    const sub=step==='intro'?'Getting started':step==='reading'?'Read the article':step==='rating'?(state.ratingTab==='article'?'Review the article':'Evaluate the article'):step==='background'?'Background information':'Completed';
    if(renderedViewKey)state.scrollPositions[renderedViewKey]=window.scrollY;
    const nextKey = screenKey();
    root.innerHTML=`<div class="site-wrap">
      <header class="header"><div class="header__identity"><div class="header__name">CSS Media</div><div class="header__domain">${icon('globe',12)} cssmedia.example</div></div><button class="icon-btn header__settings" data-action="settings" aria-label="Prototype settings" title="Prototype settings">${icon('dots',23)}</button></header>
      <div class="progress-band"><div class="progress-band__row"><span class="eyebrow">${step==='intro'?'Introduction':step==='background'?'Background questions':step==='complete'?'Completed':'Article reading'}</span><span class="article-counter">${step==='intro'?`${total} articles`:step==='background'?'All articles read':step==='complete'?'Finished':`Article ${n} of ${total}`}</span></div>
      <div class="progress-title">${sub}</div><div class="progress-track"><div class="progress-fill" style="width:${percentage}%"></div></div></div>
      ${(step==='reading'||step==='rating')?views.renderViewTabs():''}
      ${step==='intro'?views.renderIntro():step==='reading'?views.renderArticle():step==='rating'?(state.ratingTab==='article'?views.renderArticle(true):views.renderRating()):step==='background'?views.renderBackground():views.renderComplete()}
      
    </div>${views.renderSettings()}`;
    document.body.classList.toggle('modal-open',state.settingsOpen);
    renderedViewKey=nextKey;
    const wanted=progressToTop?0:(state.scrollPositions[nextKey]||0);
    window.scrollTo({top:wanted,behavior:'instant'});
    const head=root.querySelector('.header'), progress=root.querySelector('.progress-band');
    if(head&&progress)document.documentElement.style.setProperty('--progress-bottom',`${head.offsetHeight+progress.offsetHeight}px`);
    watchParagraphs();
    tickTime();
  }

  function screenKey(){
    if(state.phase==='reading')return `reading:${state.index}`;
    if(state.phase==='rating')return `rating:${state.index}:${state.ratingTab||'evaluation'}`;
    return state.phase;
  }

  // Exposure logging observes visible paragraphs; visibility does not prove comprehension.




  // Revisits during evaluation are stored separately from the initial article reading.






  function toggleHighlight(key){
    if(!state.requirements.highlightEnabled)return;
    const [pi,si]=key.split(':').map(Number),a=articleForCurrent(),sentence=sentenceSegments(a.body[pi])[si];if(!sentence)return;
    const v=state.visit;const existing=v.highlights.findIndex(x=>x.key===key);
    if(existing>=0){v.highlights.splice(existing,1);v.highlightEvents.push({action:'remove', key, at:now()});event('highlight_remove',{key});}
    else if(v.highlights.length<2){const h={key, paragraphIndex:pi, sentenceIndex:si, text:sentence};v.highlights.push(h);v.highlightEvents.push({action:'add', ...h, at:now()});event('highlight_add',h);}
    else {root.querySelector('.tip-count').textContent='Two already selected · Tap one to remove it';return;}
    persist(true);render();
  }



  // Commit this article's answers before advancing so a partial draft cannot leak to the next article.
  function submitRating(){
    tickTime();
    if(!canSubmitArticleEvaluation())return;
    if(state.reviewSession)stopReview();
    if(state.visit)recordVisitDone();
    const a=articleForCurrent();const responses={};ARTICLE_QUESTIONS.forEach(q=>{
      const raw=state.draftRatings[q.id];const selected=raw?Number(raw):null;responses[q.id]={value:selected, label:selected===null?null:q.options[selected-1]};
    });
    const reading=state.readingVisits.findLast(v=>v.articleId===a.id);
    state.ratings[a.id]={articleId:a.id,coreId:a.coreId,condition:a.condition,newsSetId:state.newsSetId,title:a.title,submittedAt:now(), allowIncompleteResponses:state.allowIncompleteResponses, responses,readingVisibleMs:reading?.visibleMs??null};
    event('article_evaluation_submitted',{articleId:a.id});state.draftRatings={};state.ratingTab='article';
    if(state.index+1<articles.length){state.index+=1;state.phase='reading';openFirstVisit();}else{state.phase='background';event('background_open');}
    persist(true);render(true);
  }

  function submitBackground(){if(!canSubmitBackground())return;
    const out={};BACKGROUND_QUESTIONS.forEach(q=>{const raw=state.background[q.id];const x=raw?Number(raw):null;out[q.id]={value:x,label:x===null?null:q.options[x-1]};});
    if(state.background.gender==='3')out.gender.selfDescribe=String(state.background.genderText||'').trim();
    state.backgroundResponses=out;state.backgroundAllowIncompleteResponses=state.allowIncompleteResponses;state.phase='complete';state.completedAt=now();event('survey_completed',{ratingCount:Object.keys(state.ratings).length});persist(true);render(true);
  }

  function exportData(){
    tickTime();
    const data={exportedAt:now(), study:'CSS Media article survey', notice:'Client-side prototype export. Data were not sent to a research server.', participantPreviewId:state.participantPreviewId, newsSetId:state.newsSetId, surveyStartedAt:state.surveyStartedAt, startedAt:state.startedAt, completedAt:state.completedAt, articleOrder:articles.map(a=>({id:a.id,coreId:a.coreId,condition:a.condition})), requirementsCurrent:state.requirements, allowIncompleteResponsesCurrent:state.allowIncompleteResponses, ratings:state.ratings, background:state.backgroundResponses||state.background, readingVisits:[...state.readingVisits,...(state.visit?[{...state.visit,status:'in_progress_at_export'}]:[])],reviewVisits:[...state.reviewVisits,...(state.reviewSession?[{...state.reviewSession,status:'in_progress_at_export'}]:[])],events:state.events};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url;link.download=`css-media-article-survey-${state.participantPreviewId.slice(0,8)}.json`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
    event('data_exported');
  }

  function resetDemo(){
    if(!confirm('Restart the prototype? This clears current locally saved progress and responses. Export the data first if you need it.'))return;
    const req={...state.requirements}, allowIncomplete=state.allowIncompleteResponses;state=freshState();state.requirements=req;state.allowIncompleteResponses=allowIncomplete;event('survey_reset');render(true);persist(true);
  }

  // A news-set change starts a new session only after an explicit confirmation.
  function applyNewsSet(){
    const field=root.querySelector('#news-set-id');
    const next=Number(field?.value);
    if(!Number.isInteger(next)||!newsSetMap.has(next)){
      alert(`Please enter a valid news set ID (${newsSets.map(s=>s.id).join(', ')}).`);
      return;
    }
    if(next===state.newsSetId){state.settingsOpen=false;event('settings_close');render();return;}
    if(!confirm(`Switch to news set ${next}? This will restart the survey and clear its current answers and interaction logs from this browser. Export data first if you need to keep it.`))return;
    const req={...state.requirements},allowIncomplete=state.allowIncompleteResponses;
    articles=chooseArticles(next);activeNewsSetId=next;
    state=freshState();state.requirements=req;state.allowIncompleteResponses=allowIncomplete;
    event('news_set_selected',{newsSetId:next,selectedArticleIds:articles.map(a=>a.id)});
    persist(true);render(true);
  }

  // One delegated click handler handles links, reading actions, tabs, and settings.
  function handleClick(e){
    if(!state)return;
    const el=e.target.closest('[data-action]');if(!el)return;
    const action=el.dataset.action;
    if(action==='close-backdrop'&&e.target!==el)return;
    if(action==='toggle-highlight'){toggleHighlight(el.dataset.key);return;}
    if(action==='apply-news-set'){applyNewsSet();return;}
    if(action==='start-survey'&&state.phase==='intro'){state.phase='reading';state.surveyStartedAt=now();event('survey_started',{newsSetId:state.newsSetId});openFirstVisit();render(true);persist(true);return;}
    if(action==='show-article'&&state.phase==='rating'){
      if(state.ratingTab!=='article'){tickTime();state.ratingTab='article';startReview();render();}return;
    }
    if(action==='show-evaluation'&&(state.phase==='rating'||state.phase==='reading')){
      if(state.phase==='reading'){
        tickTime();
        state.scrollPositions[`rating:${state.index}:article`]=window.scrollY;
        state.phase='rating';state.ratingTab='evaluation';
        event('article_evaluation_open');persist(true);render(true);
      }else if(state.ratingTab!=='evaluation'){
        stopReview();state.ratingTab='evaluation';event('article_evaluation_return');render();
      }
      return;
    }
    if(action==='settings'){tickTime();state.settingsOpen=true;event('settings_open');render();return;}
    if(action==='close-settings'||action==='close-backdrop'){state.settingsOpen=false;tracker.resetClock();event('settings_close');render();return;}
    if(action==='submit-quiz'){
      if(state.visit?.quizChoice===null||state.visit?.quizSubmitted)return;
      state.visit.quizSubmitted=true;state.visit.quizCorrect=state.visit.quizChoice===Boolean(articleForCurrent().attentionCheck.correctAnswer);state.visit.quizSubmittedAt=now();
      event('quiz_submitted',{answer:state.visit.quizChoice,correct:state.visit.quizCorrect});persist(true);render();return;
    }
    if(action==='to-rating'){
      tickTime();
      state.scrollPositions[`rating:${state.index}:article`]=window.scrollY;
      state.phase='rating';state.ratingTab='evaluation';event('article_evaluation_open');persist(true);render(true);return;
    }
    if(action==='submit-rating'){submitRating();return;}
    if(action==='submit-background'){submitBackground();return;}
    if(action==='export'){exportData();return;}
    if(action==='reset'){resetDemo();return;}
  }

  function handleChange(e){
    const input=e.target;if(!state)return;
    if(input.dataset.setting){const key=input.dataset.setting;
      if(key==='minimumSeconds'){const n=Math.max(0,Math.min(600,Math.round(Number(input.value)||0)));state.requirements.minimumSeconds=n;}
      else if(key==='allowIncompleteResponses'){state.allowIncompleteResponses=input.checked;}
      else state.requirements[key]=input.checked;
      event('settings_changed',{key,value:key==='allowIncompleteResponses'?state.allowIncompleteResponses:state.requirements[key]});persist(true);render();return;
    }
    if(input.dataset.field==='quizChoice'){if(!state.visit?.quizSubmitted){state.visit.quizChoice=input.value==='true';event('quiz_choice_changed',{value:state.visit.quizChoice});persist(true);render();}return;}
    if(input.dataset.field==='rating'){state.draftRatings[input.dataset.question]=input.value;persist(true);render();return;}
    if(input.dataset.field==='bg'){state.background[input.dataset.question]=input.value;persist(true);render();return;}
  }

  function handleInput(e){if(e.target.dataset.field==='genderText'&&state){state.background.genderText=e.target.value;persist(true);const b=document.querySelector('[data-action="submit-background"]');if(b)b.disabled=!canSubmitBackground();}}

  // Load all static study materials before restoring any browser-local survey progress.
  async function init(){
    try {
      const inputs=await loadStudyData();
      const rawConfig=inputs.config,rawArticles=inputs.articles,rawNewsSets=inputs.newsSets;
      ARTICLE_QUESTIONS=validateQuestions(inputs.articleQuestions,'article-questions.json');
      BACKGROUND_QUESTIONS=validateQuestions(inputs.backgroundQuestions,'background-questions.json');
      views.setQuestions(ARTICLE_QUESTIONS,BACKGROUND_QUESTIONS);
      studyConfig=rawConfig;
      if(!Array.isArray(rawArticles)||!Array.isArray(rawNewsSets))throw new Error('Expected article data and news sets to be JSON arrays.');
      rawArticles.forEach(a=>{if(a?.id&&Array.isArray(a.body)){
        if(byId[a.id])throw new Error(`Duplicate article ID: ${a.id}`);
        byId[a.id]=a;
      }});
      newsSets=rawNewsSets;
      for(const set of newsSets){
        if(!Number.isInteger(Number(set.id))||newsSetMap.has(Number(set.id))||!Array.isArray(set.news_set))throw new Error('Invalid or duplicated news set ID.');
        newsSetMap.set(Number(set.id),set);
      }
      const stored=getStored();
      const configuredId=Number(rawConfig.newsSetId ?? 1);
      activeNewsSetId=(stored?.version===5 && newsSetMap.has(Number(stored.newsSetId)))?Number(stored.newsSetId):configuredId;
      articles=chooseArticles(activeNewsSetId,(stored?.version===5)?stored.articleIds:null);
      if(!articles.length)throw new Error('No articles in selected set.');
      if(stored?.version===5 && Number(stored.newsSetId)===activeNewsSetId &&
         JSON.stringify(stored.articleIds)===JSON.stringify(articles.map(a=>a.id))){
        state=stored;state.settingsOpen=false;state.requirements=cleanRequirements(state.requirements);
        state.scrollPositions ||= {};state.reviewVisits ||= [];state.ratingTab ||= 'evaluation';
        if(state.phase==='rating'&&state.ratingTab==='article'){state.reviewSession=null;state.ratingTab='evaluation';}
        if(state.phase==='reading'&&!state.visit)state.visit=makeVisit(articleForCurrent());
        if(state.phase==='reading'||state.phase==='rating')event('session_resumed');
      }else{state=freshState();}
      tracker.resetClock();
      root.addEventListener('click',handleClick);
      root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-action="toggle-highlight"]')){e.preventDefault();toggleHighlight(e.target.dataset.key);}});
      root.addEventListener('change',handleChange);
      root.addEventListener('input',handleInput);
      window.addEventListener('scroll',scrollRecord,{passive:true});
      document.addEventListener('visibilitychange',()=>{tickTime();event('visibility_change',{visibility:document.visibilityState});persist(true);});
      window.addEventListener('beforeunload',()=>{tickTime();persist(true);});
      timerHandle=setInterval(tickTime,250);
      render(false);
    } catch(err){console.error(err);root.innerHTML=`<div class="site-wrap"><main class="error"><h2>Unable to load articles</h2><p>${esc(err.message)}</p><p>Open this project through a local web server or deploy it to a static host. The article and config JSON files must be accessible.</p></main></div>`;}
  }

  init();
})();
</script>
</body></html>
